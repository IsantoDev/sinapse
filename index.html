const GEN_GUIDE=`Objetivo: que o conteúdo vire óbvio pela repetição em situações reais. Todo card parte de uma cena concreta de trabalho no Brasil (varejo, banco, fintech, telecom, saúde, e-commerce, SaaS de suporte), com números realistas, e termina numa frase que o aluno pode repetir em reunião ou entrevista.

Gere exatamente 6 cards, todos sobre o tema:
1. 2 "quiz" com "mode":"reuniao" ou "trabalho": "ctx" é a fala de uma pessoa real (diretor, PM, CFO, gestor no Slack, engenheiro de dados). As alternativas são respostas possíveis. A certa responde com número, trade-off e próximo passo, em linguagem de negócio; as erradas são as respostas comuns de júnior (concordar sem checar, jargão sem tradução, "não dá", "vou investigar").
2. 1 "chain" com "mode":"entrevista": um gestor técnico pergunta e aprofunda em 3 rodadas de follow-up ("steps"), cada uma com 4 alternativas, como numa entrevista de verdade.
3. 1 "quiz" com "mode":"codigo": "code" com até 8 linhas de Python, pandas, SQL ou scikit-learn com um bug ou efeito surpreendente que acontece no trabalho real.
4. 1 "quiz" com "mode":"bolso": um número ou regra de bolso que um profissional sênior sabe de cabeça (ordem de grandeza, conta rápida, régua de interpretação), com a conta no "why". Se fizer sentido, inclua "chart" com dados realistas para interpretar.
5. 1 "flip" com "mode":"entrevista": pergunta aberta de gestor e "ans" com resposta modelo de até 90 palavras, estruturada (contexto, decisão, trade-off, resultado).
Regras para todos: a correta SEMPRE em opts[0]; as erradas são erros reais e plausíveis, nunca absurdas; "q" até 200 caracteres; "why" explica o porquê em até 60 palavras; "pro" é UMA frase de até 160 caracteres que o aluno pode dizer literalmente; conteúdo tecnicamente correto e atual; português do Brasil; sem markdown. Revise cada card: a alternativa em opts[0] precisa estar correta sem ambiguidade.

"chart" é opcional; type pode ser "bar", "line" ou "scatter" (em "scatter" use "points":[[x,y],...] com 8 a 40 pontos, "xLabel" e "yLabel").`;

function registerCard(c){if(!c||!c.id||byId[c.id])return false;CARDS.push(c);byId[c.id]=c;QUIZ.push(c);return true}
const sstr=(v,n)=>typeof v==='string'&&v.trim()?v.trim().slice(0,n):null;
function validChart(ch){if(!ch||typeof ch!=='object')return null;const type=['bar','line','scatter'].includes(ch.type)?ch.type:null;if(!type)return null;const title=sstr(ch.title,80)||'';
  if(type==='scatter'){const pts=(Array.isArray(ch.points)?ch.points:[]).filter(p=>Array.isArray(p)&&p.length>=2&&isFinite(p[0])&&isFinite(p[1])).slice(0,80).map(p=>[+p[0],+p[1]]);return pts.length>=4?{type,title,points:pts,xl:sstr(ch.xLabel,30)||'',yl:sstr(ch.yLabel,30)||''}:null}
  const labels=(Array.isArray(ch.labels)?ch.labels:[]).slice(0,14).map(l=>String(l).slice(0,14));if(labels.length<2)return null;
  const series=(Array.isArray(ch.series)?ch.series:[]).slice(0,3).map(s=>({name:sstr(s&&s.name,24)||'',values:(Array.isArray(s&&s.values)?s.values:[]).slice(0,labels.length).map(Number)})).filter(s=>s.values.length===labels.length&&s.values.every(v=>isFinite(v)));
  return series.length?{type,title,labels,series}:null}
const MODES=['reuniao','entrevista','trabalho','codigo','conceito','bolso'];
function vctx(x){if(!x||typeof x!=='object')return null;const who=sstr(x.who,40),say=sstr(x.say,320);return who&&say?{who,say}:null}
function vstep(o){if(!o||typeof o!=='object')return null;const q=sstr(o.q,420),why=sstr(o.why,900),opts=(Array.isArray(o.opts)?o.opts:[]).map(x=>sstr(x,320)).filter(Boolean);return q&&why&&opts.length>=3&&opts.length<=4&&new Set(opts).size===opts.length?{q,opts,why}:null}
function validCard(o,track,b,topic){if(!o||typeof o!=='object')return null;const id='g'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);const base={id,cat:track,gen:1,b,topic};
  const extra={};if(MODES.includes(o.mode))extra.mode=o.mode;const cx=vctx(o.ctx);if(cx)extra.ctx=cx;const pro=sstr(o.pro,300);if(pro)extra.pro=pro;
  if(o.kind==='flip'){const q=sstr(o.q,260),ans=sstr(o.ans,900);return q&&ans?{...base,...extra,kind:'flip',q,ans}:null}
  if(o.kind==='chain'){const steps=(Array.isArray(o.steps)?o.steps:[]).slice(0,4).map(vstep);if(steps.length<2||steps.some(s=>!s))return null;return{...base,mode:'entrevista',...extra,kind:'chain',steps,q:cx?cx.say:steps[0].q}}
  const s=vstep(o);if(!s)return null;
  const c={...base,...extra,kind:'quiz',...s};const code=sstr(o.code,900);if(code)c.code=code;const ch=validChart(o.chart);if(ch){c.chart=ch;c.viz='gchart'}return c}
function chooseTopic(track){const cnt={};SYL[track].forEach(t=>cnt[t]=0);QUIZ.forEach(c=>{if(catOf(c)===track&&c.topic in cnt)cnt[c.topic]++});const low=SYL[track].slice().sort((a,b)=>cnt[a]-cnt[b]).slice(0,4);return low[Math.floor(Math.random()*low.length)]}

${GEN_GUIDE}

let AC=null;

const fx=$('#fx'),fctx=fx.getContext('2d');let parts=[];
function fitFx(){const d=Math.min(2,devicePixelRatio||1);fx.width=innerWidth*d;fx.height=innerHeight*d;fctx.setTransform(d,0,0,d,0,0)}
function burst(x,y,cols,n=26){if(reduced)n=8;for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=2+Math.random()*5;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2,life:1,c:cols[i%cols.length],r:2+Math.random()*3})}}
function confetti(){const cols=[C.spark,C.gold,C.ds,C.ia,C.ml];for(let i=0;i<(reduced?20:110);i++)parts.push({x:Math.random()*innerWidth,y:-10-Math.random()*200,vx:(Math.random()-.5)*2,vy:2+Math.random()*3,life:1.6,c:cols[i%5],r:3+Math.random()*3,sq:true})}
function drawFx(){fctx.clearRect(0,0,innerWidth,innerHeight);parts=parts.filter(p=>p.life>0);parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.15;p.vx*=.98;p.life-=.018;fctx.globalAlpha=Math.max(0,Math.min(1,p.life));fctx.fillStyle=p.c;if(p.sq)fctx.fillRect(p.x,p.y,p.r,p.r*1.6);else{fctx.beginPath();fctx.arc(p.x,p.y,p.r,0,7);fctx.fill()}});fctx.globalAlpha=1}

const bg=$('#bgnet'),bctx=bg.getContext('2d');let nodes=[],pulses=[],bgW=0,bgH=0;
function fitBg(){const d=Math.min(2,devicePixelRatio||1);bgW=innerWidth;bgH=innerHeight;bg.width=bgW*d;bg.height=bgH*d;bctx.setTransform(d,0,0,d,0,0);const n=Math.round(clamp(bgW*bgH/16000,28,70));nodes=[...Array(n)].map(()=>({x:Math.random()*bgW,y:Math.random()*bgH,vx:(Math.random()-.5)*.15,vy:(Math.random()-.5)*.15}))}
function neighbors(i,R){const a=nodes[i];return nodes.map((b,j)=>({j,d:Math.hypot(a.x-b.x,a.y-b.y)})).filter(o=>o.j!==i&&o.d<R).map(o=>o.j)}
function fire(color,hops=7){const R=Math.max(140,Math.min(bgW,bgH)*.22);let cur=Math.floor(Math.random()*nodes.length),path=[cur];for(let k=0;k<hops;k++){const nb=neighbors(cur,R).filter(j=>!path.includes(j));if(!nb.length)break;cur=nb[Math.floor(Math.random()*nb.length)];path.push(cur)}if(path.length>1)pulses.push({path,p:0,color})}
function drawBg(){bctx.clearRect(0,0,bgW,bgH);const R=Math.max(140,Math.min(bgW,bgH)*.22);
  if(!reduced)nodes.forEach(n=>{n.x+=n.vx;n.y+=n.vy;if(n.x<0||n.x>bgW)n.vx*=-1;if(n.y<0||n.y>bgH)n.vy*=-1});
  for(let i=0;i<nodes.length;i++)for(let j=i+1;j<nodes.length;j++){const a=nodes[i],b=nodes[j],d=Math.hypot(a.x-b.x,a.y-b.y);if(d<R){bctx.strokeStyle=hexA(C.ds,.07*(1-d/R));bctx.lineWidth=1;bctx.beginPath();bctx.moveTo(a.x,a.y);bctx.lineTo(b.x,b.y);bctx.stroke()}}
  nodes.forEach(n=>{bctx.fillStyle=hexA(C.ds,.25);bctx.beginPath();bctx.arc(n.x,n.y,1.6,0,7);bctx.fill()});
  pulses=pulses.filter(p=>p.p<p.path.length-1);pulses.forEach(p=>{p.p+=reduced?.5:.06;const k=Math.floor(p.p),f=p.p-k;for(let s=0;s<=k&&s<p.path.length-1;s++){const a=nodes[p.path[s]],b=nodes[p.path[s+1]];const e=s<k?1:f;bctx.strokeStyle=hexA(p.color,.55*(1-(k-s)/p.path.length));bctx.lineWidth=2;bctx.beginPath();bctx.moveTo(a.x,a.y);bctx.lineTo(a.x+(b.x-a.x)*e,a.y+(b.y-a.y)*e);bctx.stroke()}

}

function renderStep(item,i){const c=item.c,s=c.steps[i],box=item.el.querySelector('.steps'),order=shuffle(s.opts.map((_,k)=>k)),d=document.createElement('div');d.className='step';

const IVL=[0,1,3,7,16,35];
const addDays=n=>{const d=new Date();d.setDate(d.getDate()+n);return dayStr(d)};
const sessShown=new Set();
const dueCards=()=>QUIZ.filter(c=>{const a=ST.ans[c.id];return a&&a.ok>0&&(a.due||'0000-00-00')<=today()&&!ST.rev.includes(c.id)&&!sessShown.has(c.id)});
function record(c,ok){const a=ST.ans[c.id]||{ok:0,bad:0,box:0};if(ok){a.ok++;a.box=Math.min(5,a.box+1);ST.ok++;sess.ok++;ST.rev=ST.rev.filter(id=>id!==c.id)}else{a.bad++;a.box=0;ST.bad++;sess.bad++;if(!ST.rev.includes(c.id))ST.rev.push(c.id);ST.errs=[c.id,...ST.errs.filter(x=>x!==c.id)].slice(0,60);sessRev.push({id:c.id,at:fc+4})}a.due=ok?addDays(IVL[a.box]):today();ST.ans[c.id]=a;sessShown.add(c.id);ST.seen[c.id]=1;save()}

function answer(item,btn){if(item.done)return;item.done=true;const c=item.c,el=item.el,oi=+btn.dataset.oi,ok=oi===0;
  el.querySelectorAll('.opt').forEach(b=>{b.disabled=true;const i=+b.dataset.oi;if(i===0)b.classList.add('ok');else if(b===btn)b.classList.add('bad');else b.classList.add('dim')});
  item.picked=c.opts[oi];record(c,ok);countDaily();

  else{combo=0;sfx.bad();buzz([40,30,40]);hud()}

async function explain(item,out,btn){if(!sampler)return;const c=item.c;btn.disabled=true;out.hidden=false;out.textContent='Pensando…';
  const ctx=c.kind==='chain'?`Entrevista. ${c.ctx?c.ctx.who+': '+c.ctx.say:''}\n${c.steps.map((s,k)=>`Rodada ${k+1}: ${s.q}\nResposta certa: ${s.opts[0]}\nPor quê: ${s.why}`).join('\n')}`:c.kind==='sim'?`Tema: ${c.title}. Contexto: ${c.hook.replace(/<[^>]+>/g,'')}`:c.kind==='flip'?`Pergunta de entrevista: ${c.q}\nResposta modelo: ${c.ans}`:`Pergunta: ${c.q}\nResposta correta: ${c.opts[0]}\nExplicação original: ${c.why}${item.picked&&item.picked!==c.opts[0]?`\nO aluno escolheu (errado): ${item.picked}`:''}`;
  const prompt=`Você é um professor de dados muito didático. Explique de outro jeito, em português do Brasil, em no máximo 110 palavras, para alguém que aprende melhor com código do que com fórmula. Use uma analogia do dia a dia de suporte ou de uma loja, e, se fizer sentido, um trecho curto de Python ou SQL. Sem títulos nem markdown pesado.\n\n${ctx}`;
  try{const r=await sampler(prompt,{modelTier:'quick',onText:({text})=>{out.textContent=text}});out.textContent=r.text||out.textContent}
  catch(e){const code=e&&e.code;out.textContent=code==='rate_limited'?'Muitas perguntas seguidas. Tente de novo em alguns segundos.':code==='not_granted'?'Sem permissão para chamar o Claude nesta página.':'Não consegui gerar outra explicação agora.';if(code==='not_granted')document.body.classList.remove('ai-on')}
  btn.disabled=false}

let feedList=[],filter='all',fc=0,sinceBreak=0,recent=[],pendingFollow=null,sessRev=[],cur=null,dwellT=null,curStart=0;
ST.rev.forEach((id,i)=>{if(byId[id])sessRev.push({id,at:2+i*3})});
const eligible=c=>c&&c.kind!=='intro'&&c.kind!=='break'&&(filter==='all'||catOf(c)===filter);
function pick(){
  if(sinceBreak>=25){sinceBreak=0;return{c:{id:'break'+fc,kind:'break',track:'neuro'}}}
  if(pendingFollow){const c=byId[pendingFollow];pendingFollow=null;if(eligible(c)&&!recent.includes(c.id))return{c,gold:Math.random()<.12}}
  const di=sessRev.findIndex(r=>r.at<=fc&&eligible(byId[r.id])&&!recent.slice(-3).includes(r.id));if(di>=0){const r=sessRev.splice(di,1)[0];return{c:byId[r.id],review:true}}
  if(Math.random()<.3){const d=dueCards().filter(c=>eligible(c)&&!recent.includes(c.id));if(d.length){const c=d[Math.floor(Math.random()*d.length)];sessShown.add(c.id);return{c,review:'spaced'}}}
  let pool=CARDS.filter(c=>eligible(c)&&!recent.includes(c.id));if(!pool.length)pool=CARDS.filter(eligible);
  const slot=fc%3;let want=slot===0?pool.filter(c=>c.kind==='sim'):pool.filter(c=>c.kind!=='sim');if(!want.length)want=pool;
  const unseen=want.filter(c=>!ST.seen[c.id]),src=unseen.length?unseen:want;
  const ws=src.map(c=>{const a=ST.ans[c.id];return unseen.length?1:1/(1+(a?a.box:0))});let r=Math.random()*ws.reduce((a,b)=>a+b,0),i=0;while(i<src.length-1&&r>ws[i]){r-=ws[i];i++}
  const c=src[i];return{c,gold:c.kind!=='sim'&&Math.random()<.12}}
function append(n){for(let k=0;k<n;k++){const it=pick();if(it.c.kind!=='break'){recent.push(it.c.id);if(recent.length>14)recent.shift();if(it.c.follow)pendingFollow=it.c.follow}sinceBreak++;fc++;mount(it)}}
function resetFeed(){feedList.forEach(it=>{visObs.unobserve(it.el);nearObs.unobserve(it.el)});$('#feed').innerHTML='';feedList=[];fc=0;recent=[];pendingFollow=null;cur=null;append(8);$('#feed').scrollTo({top:0,behavior:'auto'})}

const visObs=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting&&e.intersectionRatio>=.6){const it=feedList.find(x=>x.el===e.target);if(it&&it!==cur)setCurrent(it)}})},{root:$('#feed'),threshold:[.6]});
const nearObs=new IntersectionObserver(es=>{es.forEach(e=>{if(!e.isIntersecting)return;const it=feedList.find(x=>x.el===e.target);if(it&&!it.viz&&it.c.viz)initViz(it)})},{root:$('#feed'),rootMargin:'0px 0px 150% 0px'});
function setCurrent(it){const now=performance.now();if(cur&&curStart&&cur.c.kind!=='intro'&&cur.c.kind!=='break'){const d=(now-curStart)/1000;if(d>=4&&d<=180)ST.avgSec=ST.avgSec?ST.avgSec*.9+d*.1:d}curStart=now;
  cur=it;clearTimeout(dwellT);
  if(it.c.kind==='flip'&&!it.cdT){const cd=it.el.querySelector('.cd');let t=30;if(cd)it.cdT=setInterval(()=>{t--;if(!cd.isConnected||t<0){clearInterval(it.cdT);return}cd.textContent=t?t+'s':'tempo!'},1000)}const idx=feedList.indexOf(it);if(idx>=feedList.length-4)append(8);maybeGen();
  if(it.c.kind!=='intro'&&it.c.kind!=='break'&&!sess.seen.has(it.el)){sess.seen.add(it.el);sess.cards++}
  if(it.c.kind==='sim'&&!sess.seen.has(it.c.id)){dwellT=setTimeout(()=>{if(cur===it&&!sess.seen.has(it.c.id)){sess.seen.add(it.c.id);ST.seen[it.c.id]=1;award(5,it.el.querySelector('h2'))}},3000)}}
function initViz(it){const host=it.el.querySelector('.viz');if(!host)return;const c=document.createElement('canvas');host.appendChild(c);const ctx=c.getContext('2d');const S={c,ctx,w:0,h:0};
  const fit=()=>{const r=host.getBoundingClientRect();const d=Math.min(2,devicePixelRatio||1);if(r.width<2||r.height<2)return;S.w=r.width;S.h=r.height;c.width=Math.round(r.width*d);c.height=Math.round(r.height*d);c.style.width=r.width+'px';c.style.height=r.height+'px';ctx.setTransform(d,0,0,d,0,0);if(it.viz)it.viz.draw(performance.now(),0)};
  fit();let touched=false;const touch=()=>{if(touched)return;touched=true;award(3,host)};
  try{it.viz=VIZ[it.c.viz]({S,ctrl:it.el.querySelector('.ctrl'),card:it.el,touch,data:it.c.chart});it.viz.draw(performance.now(),0)}catch(e){console.error('[sinapse] viz',it.c.viz,e)}
  new ResizeObserver(fit).observe(host)}

const CASE_SCENE={c2:{title:'Entrevista · etapa do gestor',participants:['Marcelo','Lívia']},c3:{title:'Reunião de produto: novo checkout',participants:['Thiago','Fernanda']},c6:{title:'Comitê de crédito',participants:['Henrique','Patrícia','Sérgio']},c8:{title:'Kickoff: previsão de atrasos',participants:['Gustavo','Kátia']},c10:{title:'1:1 com a Ana',participants:['Ana']}};

function caseSetup(d,scene){return `Você é o motor de uma simulação imersiva de trabalho que treina um profissional de dados no Brasil. Você interpreta TODOS os personagens do caso e um narrador. O jogador é a pessoa do outro lado: nunca escreva falas, decisões ou pensamentos do jogador.

CASO: ${d.title} (${d.level} · ${d.setting})
Empresa: ${d.company}
Papel do jogador: ${d.player}
Situação: ${d.situation}
Objetivo do jogador: ${d.objective}
Etapas: ${d.stages.map((s,i)=>`${i+1}. ${s}`).join(' | ')}
Personagens: ${d.cast.map(p=>`${p.name} (${p.role}): ${p.style}`).join(' | ')}
Fatos ocultos (revele só quando o jogador investigar, perguntar ou pedir os dados certos; nunca entregue de graça): ${d.hidden.join(' | ')}

A interface: o jogador usa o chat corporativo da empresa. Existem conversas privadas entre o jogador e cada personagem, e um grupo chamado "${groupName(d)}" com todos. Toda mensagem do jogador chega marcada com o lugar: [Privado com Nome], [No grupo ...], [Na reunião], ou é um evento entre colchetes (ex.: [Você ligou para Nome], [Você convocou uma reunião com o grupo agora], [Você saiu da reunião]).
- Cada personagem só sabe o que viu ou ouviu. O que o jogador disse em privado ao Paulo, a Carla não sabe, a menos que alguém conte.
- Em cada mensagem sua informe "where": o nome do personagem (é a conversa privada dele com o jogador), "grupo", ou "reuniao".
- Personagens podem mandar mensagem por iniciativa própria em outra conversa quando fizer sentido (gestor cobrando prazo, colega respondendo mais tarde, alguém repassando informação).
- Reunião ou conversa ao vivo: quando a história pedir (reunião marcada chegou, apresentação, conversa presencial, chamada aceita), devolva "scene":{"mode":"meeting","title":"...","participants":["nomes de quem está presente"]} e as falas com "where":"reuniao". Uma chamada pode ser recusada de forma realista ("em reunião, te ligo às 15h"). Na reunião todos os presentes ouvem tudo, conversam entre si e reagem em tempo real.
- Quando a reunião terminar (assunto resolvido, horário acabou ou o jogador saiu), devolva "scene":{"mode":"chat"}. Sem mudança de cena, use "scene":null.
${scene&&scene.mode==='meeting'?`Cena inicial: reunião ao vivo "${scene.title}" com ${scene.participants.join(', ')}.`:'Cena inicial: chat corporativo.'}

Como conduzir:
- Realismo de empresa brasileira: cada pessoa tem agenda, pressa, humor e interesses próprios; interrompe, pede números, resiste a mudanças, muda de assunto, elogia quando merecido. Linguagem natural de chat e de reunião, em português do Brasil.
- Reaja à ação do jogador de forma coerente. Boas ações (perguntar a decisão, checar dados, propor número e próximo passo, respeitar as pessoas, falar com a pessoa certa no canal certo) destravam informação e confiança. Ações fracas (jargão sem tradução, prometer o impossível, culpar alguém em público, chutar) trazem consequências realistas, mas sempre dão chance de recuperar.
- Quando o jogador pedir dados, consultas ou arquivos, entregue artefatos plausíveis dentro do texto: resultado de SQL como tabela curta com linhas começando por "|", trecho de log, número de dashboard, mensagem encaminhada.
- Use o narrador ("who":"narrador") para passagem de tempo e contexto ("Duas horas depois...", "Quinta, 9h, a reunião com a diretoria começa").
- "stage" é a etapa em andamento (1 a ${d.stages.length}). Avance quando o objetivo da etapa atual for cumprido. "done": true quando todas as etapas forem cumpridas ou quando o caso fracassar de forma irreversível (explique pelo narrador).
- Se a mensagem do jogador for "[DICA]", responda só com {"who":"mentor","where":"mentor","text":"..."}: uma dica curta e socrática, sem dar a resposta pronta. O mentor está fora da cena.
- Mensagens curtas como chat real: 1 a 4 mensagens por turno, cada uma com até 3 frases (artefatos podem ser maiores). Em reunião, até 5 falas.

Responda SEMPRE só com JSON neste formato:
{"msgs":[{"who":"nome do personagem, narrador ou mentor","where":"nome do personagem, grupo, reuniao ou mentor","text":"..."}],"stage":1,"done":false,"scene":null}`}

function vscene(d,s){if(!s||typeof s!=='object')return null;if(s.mode==='chat')return{mode:'chat'};if(s.mode!=='meeting')return null;
  const ps=(Array.isArray(s.participants)?s.participants:[]).map(n=>{const p=d.cast.find(x=>x.name.toLowerCase()===String(n).toLowerCase());return p&&p.name}).filter(Boolean);
  return ps.length?{mode:'meeting',title:sstr(s.title,80)||'Reunião',participants:[...new Set(ps)]}:null}
function validCase(o){if(!o||typeof o!=='object')return null;const s=(v,n)=>sstr(v,n);const arr=(v,n,m)=>(Array.isArray(v)?v:[]).map(x=>s(x,n)).filter(Boolean).slice(0,m);
  const cast=(Array.isArray(o.cast)?o.cast:[]).map(p=>p&&s(p.name,30)&&s(p.role,80)?{name:s(p.name,30),role:s(p.role,80),style:s(p.style,200)||''}:null).filter(Boolean).slice(0,5);
  const d={id:'cg'+Date.now().toString(36),title:s(o.title,70),level:s(o.level,20)||'Pleno',cat:CAT_KEYS.includes(o.cat)?o.cat:'negocio',setting:s(o.setting,80)||'',company:s(o.company,120)||'',player:s(o.player,200),cast,group:s(o.group,40)||'',situation:s(o.situation,600),objective:s(o.objective,400),stages:arr(o.stages,140,6),hidden:arr(o.hidden,300,6),opening:vmsgs(o.opening),gen:1};
  if(o.scene){const sc=vscene(d,o.scene);if(sc&&sc.mode==='meeting')d.scene=sc}
  return d.title&&d.player&&d.situation&&d.objective&&cast.length&&d.stages.length>=2&&d.hidden.length&&d.opening.length?d:null}
function vmsgs(v){return(Array.isArray(v)?v:[]).map(m=>m&&sstr(m.who,40)&&sstr(m.text,1500)?{who:sstr(m.who,40),where:sstr(m.where,40)||'',text:sstr(m.text,1500)}:null).filter(Boolean).slice(0,6)}
function normWhere(a,m){const d=a.def,w=String(m.where||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,''),who=String(m.who||'').toLowerCase();
  if(who==='mentor'||w==='mentor')return MENTOR;
  if(w.startsWith('reuni'))return a.scene.mode==='meeting'?'reuniao':GROUP;
  if(w.startsWith('grupo'))return GROUP;
  const p=d.cast.find(x=>x.name.toLowerCase()===w)||d.cast.find(x=>w&&w.includes(x.name.toLowerCase()));if(p)return p.name;
  if(a.scene.mode==='meeting')return'reuniao';
  if(who!=='narrador'){const q=d.cast.find(x=>x.name.toLowerCase()===who);if(q)return q.name}
  return a.thread||GROUP}

function personColor(d,who){const i=d.cast.findIndex(p=>p.name===who);return PALETTE()[(i<0?5:i)%6]}
function fmtMsg(t){const lines=t.split('\n'),out=[];let buf=[],code=false;const flush=()=>{if(buf.length){out.push(`<pre class="art">${esc(buf.join('\n'))}</pre>`);buf=[]}};
  for(const l of lines){if(l.trim().startsWith('```')){if(code){flush();code=false}else code=true;continue}if(code||l.trim().startsWith('|')){buf.push(l);continue}flush();out.push(esc(l))}flush();
  return out.join('\n').replace(/\n?(<pre)/g,'$1').replace(/(<\/pre>)\n?/g,'$1')}
const roleOf=(d,who)=>(d.cast.find(x=>x.name===who)||{}).role||'';
function msgHTML(d,m,group){if(m.me)return`<div class="m me"><div class="b">${esc(m.text)}</div></div>`;const w=(m.who||'').toLowerCase();
  if(w==='narrador'||w==='sistema')return`<div class="m nar${w==='sistema'?' sys':''}">${fmtMsg(m.text)}</div>`;
  if(w==='mentor')return`<div class="m men"><div class="b"><span class="nm" style="--pc:var(--ia)">Mentor</span>${fmtMsg(m.text)}</div></div>`;
  return`<div class="m" style="--pc:${personColor(d,m.who)}"><span class="av" aria-hidden="true">${esc(initials(m.who||'?'))}</span><div class="b">${group?`<span class="nm">${esc(m.who)}</span>`:''}${fmtMsg(m.text)}</div></div>`}

function openCases(){$('#cases').hidden=false;renderCases()}
function closeCases(){$('#cases').hidden=true;clearInterval(mtClock)}
function renderCases(){const box=$('#cases');clearInterval(mtClock);if(caseView==='chat'&&ST.activeCase)return renderChat();if(caseView==='debrief'&&ST.activeCase&&ST.activeCase.debrief)return renderDebrief();caseView='list';
  const done={};(ST.cases||[]).forEach(h=>{done[h.id]=Math.max(done[h.id]||0,h.nota)});
  const ac=ST.activeCase,can=!!sampler;
  const card=d=>`<button class="case t-${d.cat}" type="button" data-case="${d.id}" ${can?'':'disabled'}><span class="row"><span class="chip">${CATS[d.cat]}</span><span>${esc(d.level)}</span><span>· ${esc(d.setting)}</span>${done[d.id]!=null?`<span class="score">nota ${done[d.id]}</span>`:''}</span><b>${esc(d.title)}</b><p>${esc(d.situation)}</p></button>`;
  box.innerHTML=`<div class="cs"><div class="cs-h"><button class="icon-btn" id="csBack" aria-label="Voltar ao feed"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 6l-6 6 6 6"/></svg></button><div class="t"><b>Casos</b><span>simulações com pessoas da empresa, interpretadas pelo Claude</span></div></div>
  <div class="cs-body">
   <p class="cs-intro">Você entra no personagem e resolve o problema como no trabalho: escolhe com quem falar no chat da empresa, manda mensagem no privado ou no grupo, liga, convoca reunião. Quando a história pede, o chat sai de cena e a conversa vira ao vivo. No final, nota por competência, o que um sênior faria e frases prontas.</p>
   ${can?'':'<div class="note">Os casos usam o Claude para interpretar os personagens. Abra o Sinapse pelo link do Claude, com internet, para jogar.</div>'}
   ${ac&&!ac.done?`<div class="cs-sec">Em andamento</div><button class="case t-${ac.def.cat}" type="button" id="csResume" ${can?'':'disabled'}><span class="row"><span class="chip">${CATS[ac.def.cat]}</span><span>etapa ${ac.stage} de ${ac.def.stages.length}</span>${ac.scene&&ac.scene.mode==='meeting'?'<span>· em reunião</span>':''}</span><b>Continuar: ${esc(ac.def.title)}</b><p>${esc(ac.def.objective)}</p></button>`:''}
   <div class="cs-sec">Caso sob medida</div>
   <div class="genform t-negocio"><div class="seg" id="gLevel"><span>Nível</span>${LEVELS.map((l,i)=>`<button type="button" data-i="${i}" aria-pressed="${i===genCaseOpt.level}">${l}</button>`).join('')}</div>
    <div class="seg" id="gCat"><span>Foco</span>${['Aleatório',...Object.values(CATS)].map((l,i)=>`<button type="button" data-i="${i}" aria-pressed="${i===genCaseOpt.cat}">${l}</button>`).join('')}</div>
    <div class="seg" id="gSet"><span>Situação</span>${SETTINGS.map((l,i)=>`<button type="button" data-i="${i}" aria-pressed="${i===genCaseOpt.setting}">${l.split(' (')[0]}</button>`).join('')}</div>
    <button class="btn primary" type="button" id="gGo" ${can&&!caseBusy?'':'disabled'} style="--tc:var(--spark)">${caseBusy?'Criando o caso…':'Criar caso novo com o Claude'}</button></div>
   <div class="cs-sec">Do júnior ao líder técnico</div>${CASES.map(card).join('')}
   ${(ST.genCases||[]).length?`<div class="cs-sec">Criados para você</div>${ST.genCases.slice(-8).reverse().map(card).join('')}`:''}
  </div></div>`;
  $('#csBack').addEventListener('click',closeCases);
  box.querySelectorAll('[data-case]').forEach(b=>b.addEventListener('click',()=>{const d=CASES.find(x=>x.id===b.dataset.case)||(ST.genCases||[]).find(x=>x.id===b.dataset.case);if(d)startCase(d)}));
  const rs=$('#csResume');if(rs)rs.addEventListener('click',()=>{caseView='chat';renderChat()});
  [['#gLevel','level'],['#gCat','cat'],['#gSet','setting']].forEach(([sel,k])=>box.querySelectorAll(sel+' button').forEach(b=>b.addEventListener('click',()=>{genCaseOpt[k]=+b.dataset.i;box.querySelectorAll(sel+' button').forEach(x=>x.setAttribute('aria-pressed',x===b))})));
  $('#gGo').addEventListener('click',genCase)}

async function genCase(){if(!sampler||caseBusy)return;caseBusy=true;renderCases();
  const lvl=LEVELS[genCaseOpt.level],cat=genCaseOpt.cat?CAT_KEYS[genCaseOpt.cat-1]:CAT_KEYS[Math.floor(Math.random()*4)],set=SETTINGS[genCaseOpt.setting];
  const prev=[...CASES,...(ST.genCases||[])].map(c=>'- '+c.title).join('\n');
  const prompt=`Crie um caso de simulação de trabalho para treinar um profissional de dados no Brasil.
Nível do jogador: ${lvl}. Foco de competência: ${CATS[cat]}. Tipo de situação: ${set}.
O caso precisa ser realista e do dia a dia: empresa brasileira plausível (setor variado), problema concreto com números, 2 a 4 personagens com personalidades e interesses diferentes (pelo menos um com algum conflito ou resistência), 3 a 5 etapas que levam ao objetivo, e 3 a 5 fatos ocultos que o jogador só descobre investigando ou perguntando bem.
O jogador usa o chat corporativo da empresa (conversas privadas com cada personagem e um grupo do projeto) e às vezes entra em reuniões ao vivo. Se o caso começa numa reunião, entrevista ou conversa presencial, inclua "scene" com os participantes; senão omita "scene". A abertura tem 1 mensagem do narrador situando a cena e 1 ou 2 falas que já colocam o problema, cada uma com "where" (o nome de quem manda, no privado com o jogador; "grupo"; ou "reuniao" se começar ao vivo).
Não repita estes casos:
${prev}
Responda só com JSON:
{"title":"...","level":"${lvl}","cat":"${cat}","setting":"...","company":"...","player":"Você é ...","cast":[{"name":"...","role":"...","style":"..."}],"group":"nome curto do grupo do projeto","situation":"...","objective":"...","stages":["..."],"hidden":["..."],"scene":{"mode":"meeting","title":"...","participants":["..."]},"opening":[{"who":"narrador","where":"...","text":"..."},{"who":"<nome de um personagem>","where":"...","text":"..."}]}`;
  try{const o=await sampler.json(prompt,{modelTier:'default',cache:false});const d=validCase(o);if(!d)throw{code:'invalid'};ST.genCases=[...(ST.genCases||[]),d].slice(-20);save();caseBusy=false;startCase(d)}
  catch(e){caseBusy=false;genChip(e&&e.code==='rate_limited'?'Limite de uso do Claude. Tente de novo em alguns minutos.':'Não consegui criar o caso agora. Tente de novo.',3500);renderCases()}}

function startCase(d){const sc=d.scene||CASE_SCENE[d.id]||null;
  const scene=sc&&sc.participants?{mode:'meeting',title:sc.title||d.title,participants:sc.participants.filter(n=>d.cast.some(p=>p.name===n))}:{mode:'chat'};
  const a={v:2,def:d,stage:1,done:false,scene,meet:scene.mode==='meeting'?1:0,meetStart:Date.now(),thread:null,unread:{},view:'thread',log:[],api:[],debrief:null};
  const first=d.opening.find(m=>m.who!=='narrador');a.thread=first&&d.cast.some(p=>p.name===first.who)?first.who:(d.cast[0]||{}).name;
  const opening=d.opening.map(m=>({who:m.who,text:m.text,where:m.where||(scene.mode==='meeting'?'reuniao':m.who)}));
  opening.forEach(m=>{m.where=normWhere(a,m);a.log.push({...m,meet:m.where==='reuniao'?a.meet:0})});
  if(scene.mode==='chat'){const w=a.log.find(m=>m.who!=='narrador');if(w)a.thread=w.where;a.log.forEach(m=>{if(m.who==='narrador')m.where=a.thread})}
  a.api=[{role:'user',content:caseSetup(d,scene)+'\n\nA cena começa com as mensagens abaixo (já mostradas ao jogador). Depois disso, aguarde a ação do jogador.'},{role:'assistant',content:JSON.stringify({msgs:opening,stage:1,done:false,scene:null})}];
  ST.activeCase=a;save();caseView='chat';renderChat();sfx.tick()}

/* migra casos salvos na versão de chat único */
function migrateCase(a){if(a.v===2)return a;const first=(a.def.cast[0]||{}).name;Object.assign(a,{v:2,scene:{mode:'chat'},meet:0,unread:{},view:'thread',thread:first});a.log.forEach(m=>{m.where=m.me||m.who==='narrador'?first:(a.def.cast.some(p=>p.name===m.who)?m.who:m.who==='mentor'?MENTOR:first);m.meet=0});return a}

function renderChat(){const a=migrateCase(ST.activeCase);caseView='chat';clearInterval(mtClock);if(a.scene.mode==='meeting')renderMeeting();else renderTeams()}

/* ---------- chat corporativo ---------- */
function threadsOf(a){const d=a.def;return[{id:MENTOR,name:'Mentor',role:'fora da cena · dicas'},{id:GROUP,name:groupName(d),role:d.cast.map(p=>p.name).join(', ')},...d.cast.map(p=>({id:p.name,name:p.name,role:p.role}))]}

function threadLog(a){return a.log.filter(m=>m.where===a.thread&&!m.meet)}

    <div class="stagebar" id="cvBar"></div>
    <div class="tm-tools"><button class="rbtn" id="cvObjBtn" type="button" aria-expanded="false">Objetivo</button><button class="rbtn" id="cvEnd" type="button">Encerrar e avaliar</button><span class="sp"></span><button class="rbtn" id="cvRestart" type="button">Recomeçar</button></div>

    <div class="tm-list" id="tmList">${listHTML(a)}</div></aside>
   <section class="tm-main"><div class="tm-mh" style="--pc:${head.col}"><button class="icon-btn tm-back" id="tmBack" aria-label="Ver conversas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 6l-6 6 6 6"/></svg></button><span class="av" aria-hidden="true">${esc(head.ini)}</span><div class="t"><b>${esc(head.name)}</b><span>${esc(head.role)}</span></div><span class="sp"></span>
     ${isP?`<button class="rbtn call" id="tmCall" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg>Ligar</button>`:th===GROUP?`<button class="rbtn call" id="tmMeet" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="M16 10l5-3v10l-5-3"/></svg>Reunião agora</button>`:''}</div>
    <div class="cs-body tm-log" id="cvLog" aria-live="polite"></div>
    ${th===MENTOR?`<div class="cv-in"><button class="btn primary" id="cvHint" type="button" style="--tc:var(--ia);flex:1">Pedir uma dica ao mentor</button></div>`:`<div class="cv-in"><textarea id="cvText" rows="1" placeholder="Mensagem para ${esc(head.name)}" aria-label="Sua mensagem"></textarea><button class="send" id="cvSend" aria-label="Enviar"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button></div>`}
   </section></div>`;
  a.unread[th]=0;fillThread();updStage();bindCommon();
  $('#tmList').addEventListener('click',e=>{const b=e.target.closest('[data-th]');if(!b)return;a.thread=b.dataset.th;a.view='thread';save();renderTeams()});
  $('#tmBack').addEventListener('click',()=>{a.view='list';renderTeams()});
  const call=$('#tmCall');if(call)call.addEventListener('click',()=>{addLog({who:'narrador',text:`Chamando ${th}…`,where:th});sendCase(`[Você ligou para ${th}]`,'event')});
  const mt=$('#tmMeet');if(mt)mt.addEventListener('click',()=>{addLog({who:'narrador',text:'Você convocou uma reunião com o grupo.',where:GROUP});sendCase('[Você convocou uma reunião com o grupo agora]','event')});
  const h=$('#cvHint');if(h)h.addEventListener('click',()=>sendCase('[DICA]','hint'));
  lockChat(caseBusy||a.done)}
function fillThread(){const a=ST.activeCase,log=$('#cvLog');if(!log)return;const g=a.thread===GROUP;
  const items=threadLog(a);log.innerHTML=items.length?items.map(m=>msgHTML(a.def,m,g)).join(''):`<div class="m nar">${a.thread===MENTOR?'O mentor não participa da cena. Peça uma dica quando travar: ele responde com uma pergunta, não com a resposta.':'Nenhuma mensagem ainda. Comece a conversa.'}</div>`;
  if(a.debrief&&a.thread!==MENTOR)log.insertAdjacentHTML('beforeend',`<button class="btn" type="button" id="seeDebrief" style="align-self:center">Ver avaliação</button>`);
  const sd=$('#seeDebrief');if(sd)sd.addEventListener('click',()=>{caseView='debrief';renderDebrief()});
  log.scrollTop=log.scrollHeight}
function bindCommon(){const a=ST.activeCase,d=a.def;
  $('#cvBack').addEventListener('click',()=>{caseView='list';renderCases()});
  const ob=$('#cvObjBtn');if(ob)ob.addEventListener('click',e=>{const o=$('#cvObj');o.hidden=!o.hidden;e.currentTarget.setAttribute('aria-expanded',!o.hidden)});
  const ta=$('#cvText');if(ta){ta.addEventListener('input',()=>{ta.style.height='auto';ta.style.height=Math.min(140,ta.scrollHeight)+'px'});ta.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendCase(ta.value)}})}
  const sb=$('#cvSend');if(sb)sb.addEventListener('click',()=>sendCase($('#cvText').value));
  const en=$('#cvEnd');if(en)en.addEventListener('click',endCase);
  const rs=$('#cvRestart');if(rs){let armed=false;rs.addEventListener('click',()=>{if(!armed){armed=true;rs.textContent='Toque de novo para recomeçar';setTimeout(()=>{if(rs.isConnected){armed=false;rs.textContent='Recomeçar'}},3500);return}startCase(d)})}}

/* ---------- reunião ao vivo ---------- */
function renderMeeting(){const a=ST.activeCase,d=a.def,sc=a.scene,box=$('#cases');
  const tile=(n,me)=>`<div class="tile${me?' me':''}" data-who="${esc(n)}" style="--pc:${me?C.spark:personColor(d,n)}"><span class="av big" aria-hidden="true">${me?'VC':esc(initials(n))}</span><b>${me?'Você':esc(n)}</b><small>${me?'':esc(roleOf(d,n))}</small></div>`;
  box.innerHTML=`<div class="mt t-${d.cat}"><div class="mt-top"><span class="live">ao vivo</span><div class="t"><b>${esc(sc.title)}</b><span id="cvStage"></span></div><span class="clock" id="mtClock">00:00</span></div>
   <div class="stagebar" id="cvBar"></div>
   <div class="mt-grid n${Math.min(sc.participants.length+1,6)}">${sc.participants.map(n=>tile(n)).join('')}${tile('Você',true)}</div>
   <div class="mt-cap" id="cvLog" aria-live="polite"></div>
   <div class="cv-in"><textarea id="cvText" rows="1" placeholder="Fale na reunião…" aria-label="Sua fala"></textarea><button class="send" id="cvSend" aria-label="Falar"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button></div>
   <div class="cv-act"><button class="rbtn" id="cvHint" type="button">Dica do mentor</button><button class="rbtn" id="cvObjBtn" type="button" aria-expanded="false">Objetivo</button><span class="sp"></span><button class="rbtn leave" id="mtLeave" type="button">Sair da reunião</button><button class="rbtn" id="cvEnd" type="button">Encerrar e avaliar</button></div>
   <div class="cv-obj" id="cvObj" hidden><div><b>Objetivo:</b> ${esc(d.objective)}</div><ol id="cvSteps"></ol></div>
   <button class="rbtn" id="cvBack" type="button" style="position:absolute;top:10px;right:12px" aria-label="Voltar para a lista de casos">✕</button></div>`;
  const log=$('#cvLog');log.innerHTML=a.log.filter(m=>m.meet===a.meet||(m.where===MENTOR&&m.meetHint===a.meet)).map(capHTML).join('')||'<div class="cap nar">A reunião começou.</div>';log.scrollTop=log.scrollHeight;
  updStage();bindCommon();
  $('#cvHint').addEventListener('click',()=>sendCase('[DICA]','hint'));
  $('#mtLeave').addEventListener('click',()=>sendCase('[Você saiu da reunião]','event'));
  const t0=a.meetStart||Date.now(),ck=$('#mtClock');const tick=()=>{const s=Math.floor((Date.now()-t0)/1000);ck.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};tick();mtClock=setInterval(()=>{if(!ck.isConnected)return clearInterval(mtClock);tick()},1000);
  lockChat(caseBusy||a.done)}
function capHTML(m){const d=ST.activeCase.def;if(m.me)return`<div class="cap me"><b>Você</b>${esc(m.text)}</div>`;const w=(m.who||'').toLowerCase();
  if(w==='narrador'||w==='sistema')return`<div class="cap nar">${fmtMsg(m.text)}</div>`;if(w==='mentor')return`<div class="cap men"><b>Mentor</b>${fmtMsg(m.text)}</div>`;
  return`<div class="cap" style="--pc:${personColor(d,m.who)}"><b>${esc(m.who)}</b>${fmtMsg(m.text)}</div>`}
function speak(who,on){const t=document.querySelector(`.tile[data-who="${CSS.escape(who)}"]`);if(t)t.classList.toggle('speaking',on)}
async function enterMeeting(sc){const a=ST.activeCase,prev=a.thread;addLog({who:'narrador',text:`Reunião “${sc.title}” com ${sc.participants.join(', ')}.`,where:sc.participants.length===1&&a.def.cast.some(p=>p.name===sc.participants[0])?sc.participants[0]:GROUP});
  a.scene=sc;a.meet=(a.meet||0)+1;a.meetStart=Date.now();a.prevThread=prev;save();
  if(caseView==='chat'){$('#cases').insertAdjacentHTML('beforeend','<div class="mt-join">Entrando na reunião…</div>');await sleep(900);renderMeeting()}}
async function exitMeeting(){const a=ST.activeCase;a.scene={mode:'chat'};a.view='thread';a.thread=a.prevThread||a.thread||GROUP;save();if(caseView==='chat'){await sleep(1100);renderTeams()}}

/* ---------- mensagens ---------- */
function addLog(m){const a=ST.activeCase;a.log.push(m);if(a.log.length>160)a.log.shift();if(caseView!=='chat')return;const log=$('#cvLog');if(!log)return;
  if(a.scene.mode==='meeting'){if(m.where==='reuniao'||m.where===MENTOR){log.insertAdjacentHTML('beforeend',capHTML(m));log.scrollTop=log.scrollHeight}}
  else if(m.where===a.thread&&!m.meet){const e=log.querySelector('.m.nar:only-child');if(e&&!a.log.some(x=>x!==m&&x.where===a.thread))e.remove();log.insertAdjacentHTML('beforeend',msgHTML(a.def,m,a.thread===GROUP));log.scrollTop=log.scrollHeight}
  const l=$('#tmList');if(l)l.innerHTML=listHTML(a)}
function toast(a,m){const box=$('#cases');const el=document.createElement('button');el.type='button';el.className='tm-toast';el.style.setProperty('--pc',m.where===GROUP?C.spark:personColor(a.def,m.who));
  el.innerHTML=`<b>${esc(m.where===GROUP?groupName(a.def)+' · '+m.who:m.who)}</b><span>${esc(m.text.replace(/\s+/g,' ').slice(0,90))}</span>`;
  el.addEventListener('click',()=>{if(a.scene.mode==='meeting')return;a.thread=m.where;a.view='thread';renderTeams();el.remove()});box.appendChild(el);setTimeout(()=>el.remove(),4200)}
function typing(who){const a=ST.activeCase,log=$('#cvLog');if(!log)return null;if(a.scene.mode==='meeting'){speak(who,true);return{remove(){speak(who,false)}}}
  const el=document.createElement('div');el.className='m typing';el.style.setProperty('--pc',who==='Mentor'?C.ia:personColor(a.def,who));el.innerHTML=`<span class="av">${esc(initials(who||'?'))}</span><div class="b"><i></i><i></i><i></i></div>`;log.appendChild(el);log.scrollTop=log.scrollHeight;return el}
async function playMsgs(msgs){const a=ST.activeCase;
  for(const raw of msgs){const m={who:raw.who,text:raw.text,where:normWhere(a,raw)};const w=m.who.toLowerCase();
    if(m.where==='reuniao'){m.meet=a.meet;if(w!=='narrador'&&caseView==='chat'){speak(m.who,true);await sleep(Math.min(2400,600+m.text.length*13));addLog(m);await sleep(350);speak(m.who,false)}else addLog(m)}
    else{m.meet=0;if(m.where===MENTOR&&a.scene.mode==='meeting')m.meetHint=a.meet;
      const visible=caseView==='chat'&&(a.scene.mode==='meeting'?m.where===MENTOR:m.where===a.thread&&a.view==='thread');
      if(visible&&w!=='narrador'&&w!=='mentor'){const t=typing(m.who);await sleep(Math.min(2200,500+m.text.length*12));if(t)t.remove()}
      addLog(m);if(!visible&&m.where!==MENTOR){a.unread[m.where]=(a.unread[m.where]||0)+1;const l=$('#tmList');if(l)l.innerHTML=listHTML(a);if(w!=='narrador')toast(a,m)}}
    sfx.tick()}}

async function sendCase(text,kind='msg'){const a=ST.activeCase;if(!a||a.done||caseBusy||!sampler)return;text=(text||'').trim();if(!text)return;
  const inMeet=a.scene.mode==='meeting',ta=$('#cvText');
  const content=kind==='hint'?'[DICA]':kind==='event'?text:(inMeet?'[Na reunião] ':a.thread===GROUP?`[No grupo ${groupName(a.def)}] `:`[Privado com ${a.thread}] `)+text;
  let mine=null;if(kind==='msg'){mine={me:true,text,where:inMeet?'reuniao':a.thread,meet:inMeet?a.meet:0};addLog(mine);if(ta){ta.value='';ta.style.height='auto'}}
  caseBusy=true;lockChat(true);a.api.push({role:'user',content});
  const who=kind==='hint'?'Mentor':inMeet?(a.scene.participants[0]):(a.thread===GROUP?(a.def.cast[0]||{}).name:a.thread);
  const tip=kind==='hint'&&!inMeet&&a.thread!==MENTOR?null:typing(who);
  try{const r=await sampler.json(a.api,{modelTier:'default',cache:false});if(tip)tip.remove();
    const msgs=vmsgs(r&&r.msgs),sc=vscene(a.def,r&&r.scene);if(!msgs.length&&!sc)throw{code:'empty'};
    a.api.push({role:'assistant',content:JSON.stringify({msgs,stage:r.stage,done:!!r.done,scene:sc})});
    if(kind==='hint'&&!inMeet&&a.thread!==MENTOR){a.thread=MENTOR;a.view='thread';renderTeams()}
    if(sc&&sc.mode==='meeting'&&!inMeet)await enterMeeting(sc);
    await playMsgs(msgs);
    const ns=clamp(parseInt(r.stage,10)||a.stage,1,a.def.stages.length);if(ns>a.stage){award(15*(ns-a.stage),$('#cvStage'));fire(C.spark)}a.stage=Math.max(a.stage,ns);
    if(sc&&sc.mode==='chat'&&a.scene.mode==='meeting')await exitMeeting();
    if(r.done){a.done=true;updStage();save();caseBusy=false;await endCase();return}
    updStage();save()}
  catch(e){if(tip)tip.remove();a.api.pop();
    if(mine){const i=a.log.lastIndexOf(mine);if(i>=0)a.log.splice(i,1);if(caseView==='chat'){renderChat();const t=$('#cvText');if(t)t.value=text}}
    const note={who:'sistema',text:e&&e.code==='rate_limited'?'Limite de uso do Claude. Espere um pouco e tente de novo.':'A cena não respondeu. Sua mensagem voltou para a caixa; envie de novo.',where:inMeet?'reuniao':a.thread,meet:inMeet?a.meet:0};
    addLog(note);a.log.splice(a.log.indexOf(note),1)}
  caseBusy=false;lockChat(a.done)}

function updStage(){const a=ST.activeCase;if(!a)return;const d=a.def,n=d.stages.length,st=Math.min(a.stage,n);
  const s=$('#cvStage');if(s)s.textContent=a.done?'caso encerrado':`etapa ${st} de ${n} · ${d.stages[st-1]}`;
  const bar=$('#cvBar');if(bar)bar.innerHTML=d.stages.map((_,i)=>`<i class="${a.done||i<st-1?'on':''}"></i>`).join('');
  const ol=$('#cvSteps');if(ol)ol.innerHTML=d.stages.map((x,i)=>`<li class="${i<st-1||a.done?'done':i===st-1?'now':''}">${esc(x)}</li>`).join('')}
function lockChat(on){['#cvSend','#cvHint','#cvEnd','#tmCall','#tmMeet','#mtLeave'].forEach(s=>{const e=$(s);if(e)e.disabled=on});const ta=$('#cvText');if(ta){ta.disabled=on;if(ST.activeCase&&ST.activeCase.done)ta.placeholder='Caso encerrado'}}

async function endCase(){const a=ST.activeCase;if(!a||caseBusy||!sampler)return;if(a.debrief){caseView='debrief';renderDebrief();return}caseBusy=true;lockChat(true);
  genChip('O mentor está lendo a conversa…');const d=a.def;
  const where=m=>m.where==='reuniao'?'reunião':m.where===GROUP?'grupo':m.where===MENTOR?'mentor':'privado com '+m.where;
  const transcript=a.log.filter(m=>m.who!=='sistema').map(m=>`[${where(m)}] ${m.me?'JOGADOR':m.who}: ${m.text}`).join('\n').slice(-16000);
  const prompt=`Você é um mentor sênior de ciência de dados avaliando como um profissional se saiu numa simulação de trabalho. Seja honesto, específico e construtivo, citando momentos do diálogo. Avalie também se ele falou com as pessoas certas, no canal certo (privado, grupo, reunião) e no momento certo.
Caso: ${d.title} (${d.level}). Objetivo: ${d.objective}
Etapas: ${d.stages.join(' | ')}
Fatos ocultos que podiam ser descobertos: ${d.hidden.join(' | ')}
Transcrição (entre colchetes, onde cada mensagem aconteceu):
${transcript}

Responda só com JSON:
{"nota":0-10,"resumo":"2 frases sobre o desempenho","fortes":["até 3 acertos concretos"],"melhorar":["até 3 pontos concretos, cada um com o que dizer ou fazer em vez disso"],"senior":"como um profissional sênior teria conduzido o caso, em até 70 palavras","frases":["2 ou 3 frases prontas que o jogador pode usar em situações parecidas"],"comp":{"dados":0-5 ou null,"estat":0-5 ou null,"modelo":0-5 ou null,"negocio":0-5 ou null}}
Use null nas competências que o caso não exercitou.`;
  try{const r=await sampler.json(prompt,{modelTier:'default',cache:false});genChip('');
    const nota=clamp(Math.round(+r.nota||0),0,10),list=(v,n)=>(Array.isArray(v)?v:[]).map(x=>sstr(x,400)).filter(Boolean).slice(0,n);
    const comp={};CAT_KEYS.forEach(k=>{const v=r.comp&&r.comp[k];comp[k]=v==null||!isFinite(v)?null:clamp(Math.round(+v),0,5)});
    a.debrief={nota,resumo:sstr(r.resumo,500)||'',fortes:list(r.fortes,3),melhorar:list(r.melhorar,3),senior:sstr(r.senior,700)||'',frases:list(r.frases,3),comp};a.done=true;
    ST.cases=[...(ST.cases||[]),{id:d.id,title:d.title,cat:d.cat,nota,date:today()}].slice(-40);
    ST.casePhrases=[...a.debrief.frases.map(t=>({t,cat:d.cat})),...(ST.casePhrases||[])].slice(0,40);
    award(40+nota*8,$('#cvStage'));if(nota>=7){confetti();sfx.lvl()}touchDay();save();
    caseBusy=false;caseView='debrief';renderDebrief();return}
  catch(e){genChip('Não consegui gerar a avaliação agora. Toque em "Encerrar e avaliar" de novo.',4000)}
  caseBusy=false;lockChat(a.done)}
function renderDebrief(){const a=ST.activeCase,d=a.def,r=a.debrief,box=$('#cases');clearInterval(mtClock);const comp=CAT_KEYS.filter(k=>r.comp[k]!=null);
  box.innerHTML=`<div class="cs t-${d.cat}"><div class="cs-h"><button class="icon-btn" id="dbBack" aria-label="Voltar para a lista de casos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 6l-6 6 6 6"/></svg></button><div class="t"><b>Avaliação</b><span>${esc(d.title)}</span></div></div>
  <div class="cs-body"><div class="debrief"><h5>Avaliação do mentor</h5><div style="display:flex;align-items:baseline;gap:10px"><span class="nota">${r.nota}</span><span style="color:var(--muted)">de 10</span></div><p style="margin:0">${esc(r.resumo)}</p>
  ${comp.length?`<div class="mastery">${comp.map(k=>`<div class="mrow t-${k}"><span>${CATS[k]}</span><div class="mbar"><i style="width:${r.comp[k]*20}%"></i></div><output>${r.comp[k]}/5</output></div>`).join('')}</div>`:''}
  ${r.fortes.length?`<h5>O que funcionou</h5><ul>${r.fortes.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}
  ${r.melhorar.length?`<h5>Para a próxima</h5><ul>${r.melhorar.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}
  ${r.senior?`<h5>Como um sênior conduziria</h5><p style="margin:0">${esc(r.senior)}</p>`:''}
  ${r.frases.length?`<div class="pro" style="--tc:var(--spark)"><span class="lab">Frases prontas</span>${r.frases.map(esc).join('<br>')}</div>`:''}</div>
  <div class="btnrow"><button class="btn" id="dbConv" type="button">Rever a conversa</button><button class="btn primary" id="dbAgain" type="button" style="--tc:var(--spark)">Jogar de novo</button><button class="btn" id="dbList" type="button">Outros casos</button></div></div></div>`;
  $('#dbBack').addEventListener('click',()=>{caseView='list';renderCases()});$('#dbList').addEventListener('click',()=>{caseView='list';renderCases()});
  $('#dbConv').addEventListener('click',()=>{a.scene={mode:'chat'};caseView='chat';renderTeams()});$('#dbAgain').addEventListener('click',()=>startCase(d))}
$('#openCases').addEventListener('click',openCases);

/* ================= perfil ================= */
function openSheet(){const li=levelInfo(ST.xp),tot=ST.ok+ST.bad,phr=QUIZ.filter(c=>c.pro&&(ST.ans[c.id]||{}).ok>0).reverse();
  const tracks=CAT_KEYS.map(k=>{const qs=QUIZ.filter(c=>catOf(c)===k),m=qs.filter(c=>(ST.ans[c.id]||{}).box>=2).length;return{k,m,n:qs.length}});
  const item=id=>{const c=byId[id];if(!c)return'';const txt=c.q||c.title;return `<div class="li t-${catOf(c)}"><span class="chip">${CAT_LABEL[catOf(c)]}</span><span>${esc(txt)}</span>${c.why?`<small>${esc(c.why)}</small>`:c.ans?`<small>${esc(c.ans)}</small>`:''}</div>`};
  $('#sheet').innerHTML=`<div class="sheet-in" role="dialog" aria-label="Seu progresso">
   <div class="sheet-head"><h3>Nível ${li.L} · ${esc(rankOf(li.L))}</h3><button class="icon-btn" id="closeSheet" aria-label="Fechar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
   <div class="statgrid"><div class="stat"><b>${ST.xp.toLocaleString('pt-BR')}</b><span>XP total</span></div><div class="stat"><b>${tot?pct(ST.ok/tot,0):'–'}</b><span>acertos (${tot})</span></div><div class="stat"><b>${ST.best}</b><span>maior combo</span></div></div>
   <div><h4>Domínio por categoria (acertou 2× seguidas)</h4><div class="mastery">${tracks.map(t=>`<div class="mrow t-${t.k}"><span>${CATS[t.k]}</span><div class="mbar"><i style="width:${t.n?t.m/t.n*100:0}%"></i></div><output>${t.m}/${t.n}</output></div>`).join('')}</div></div>
   <div><h4>Frases prontas (${phr.length})</h4><div class="list">${phr.length?phr.slice(0,25).map(c=>`<div class="li t-${catOf(c)}"><span class="chip">${MODE_LABEL[c.mode]||CAT_LABEL[catOf(c)]}</span><span>${esc(c.pro)}</span></div>`).join(''):'<p class="empty">Cada card que você acerta deixa aqui uma frase pronta para reunião e entrevista. Releia antes de entrar numa.</p>'}</div></div>
   ${(ST.casePhrases||[]).length?`<div><h4>Frases dos casos (${ST.casePhrases.length})</h4><div class="list">${ST.casePhrases.slice(0,15).map(p=>`<div class="li t-${p.cat}"><span class="chip">${CATS[p.cat]||'Caso'}</span><span>${esc(p.t)}</span></div>`).join('')}</div></div>`:''}
   <div><h4>Caderno de erros (${ST.errs.length})</h4><div class="list">${ST.errs.length?ST.errs.slice(0,15).map(item).join(''):'<p class="empty">Nada aqui ainda. O que você errar entra aqui com a explicação.</p>'}</div></div>
   <div><h4>Salvos (${ST.saved.length})</h4><div class="list">${ST.saved.length?ST.saved.map(item).join(''):'<p class="empty">Toque em Salvar num card para guardar aqui.</p>'}</div></div>
   <div><h4>Conteúdo novo e uso offline</h4><p class="hook" style="margin-bottom:10px"><span class="gen-count">${GEN.length}</span> cards gerados pelo Claude, somando ${CARDS.length} no total. Reserva de cards ainda não vistos: <b class="reserve-min">~${Math.min(reserveMin(),RESERVE_MIN)}</b> de ${RESERVE_MIN} min (no seu ritmo de ~${Math.round(secPerCard())} s por card). A geração só roda com internet. Para estudar sem conexão, baixe o arquivo: ele leva todos os cards e seu progresso e abre em qualquer navegador.</p>
    <div class="btnrow"><button class="btn gen-toggle ai-only" type="button" aria-pressed="${!!ST.autoGen}"></button><button class="btn ai-only" id="genNow" type="button">Gerar 6 agora</button><button class="btn" id="dlOffline" type="button">Baixar versão offline (.html)</button></div><p class="sync" id="dlMsg" style="margin-top:8px"></p></div>
   <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><span class="sync">progresso salvo: ${cloudState==='nuvem'?'na sua conta (sincroniza entre aparelhos)':'neste navegador'}</span><button class="btn danger" id="resetBtn" type="button">Zerar progresso</button></div>
  </div>`;
  $('#sheet').hidden=false;$('#closeSheet').addEventListener('click',closeSheet);refreshGenUI();
  $('#genNow').addEventListener('click',()=>{gen.backoff=0;generate(pickGenTrack())});
  $('#dlOffline').addEventListener('click',e=>exportOffline(e.currentTarget,$('#dlMsg')));
  const rb=$('#resetBtn');let armed=false,tmr;rb.addEventListener('click',()=>{if(!armed){armed=true;rb.textContent='Toque de novo para apagar tudo';tmr=setTimeout(()=>{armed=false;rb.textContent='Zerar progresso'},4000);return}clearTimeout(tmr);const snd=ST.sound;ST=DEF();ST.sound=snd;sessRev=[];combo=0;lastLevel=1;save();hud(false);closeSheet();resetFeed()})}
function closeSheet(){$('#sheet').hidden=true}
$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet')closeSheet()});
$('#lvlBtn').addEventListener('click',openSheet);
$('#soundBtn').addEventListener('click',()=>{ST.sound=!ST.sound;save();hud(false);sfx.tick()});
document.querySelectorAll('.tab[data-f]').forEach(b=>b.addEventListener('click',()=>{if(b.dataset.f===filter)return;filter=b.dataset.f;document.querySelectorAll('.tab[data-f]').forEach(x=>x.setAttribute('aria-selected',x===b));resetFeed()}));
addEventListener('keydown',e=>{if(!$('#cases').hidden){if(e.key==='Escape'&&e.target.tagName!=='TEXTAREA')closeCases();return}if(!$('#sheet').hidden){if(e.key==='Escape')closeSheet();return}if(e.target.tagName==='INPUT')return;const f=$('#feed');
  if(e.key==='ArrowDown'||e.key==='j'||e.key==='J'||e.key===' '){e.preventDefault();f.scrollBy({top:f.clientHeight})}
  else if(e.key==='ArrowUp'||e.key==='k'||e.key==='K'){e.preventDefault();f.scrollBy({top:-f.clientHeight})}
  else if(/^[1-4]$/.test(e.key)&&cur&&cur.c.kind==='quiz'&&!cur.done){const b=cur.el.querySelectorAll('.opt')[+e.key-1];if(b)b.click()}
  else if(/^[1-4]$/.test(e.key)&&cur&&cur.c.kind==='chain'&&cur.stepEl&&!cur.stepDone){const b=cur.stepEl.querySelectorAll('.opt')[+e.key-1];if(b)b.click()}});
addEventListener('resize',()=>{fitFx();fitBg()});

/* ================= boot ================= */
fitFx();fitBg();hud(false);
(async()=>{if(PWA)await Promise.race([loadRemoteCards(),new Promise(r=>setTimeout(r,3000))]);
  ST.rev.forEach((id,i)=>{if(byId[id]&&!sessRev.some(r=>r.id===id))sessRev.push({id,at:2+i*3})});
  mount({c:{id:'intro',kind:'intro',track:'neuro'}});append(8)})();
requestAnimationFrame(loop);
initCloud();initAI();
setInterval(maybeGen,15000);
addEventListener('online',()=>{genChip('Internet de volta. Sincronizando e repondo a reserva.',2500);flush();maybeGen()});
addEventListener('offline',()=>genChip(`Sem internet. Você tem ~${reserveMin()} min de cards novos; seu progresso sincroniza quando a conexão voltar.`,6000));
</script>

if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
