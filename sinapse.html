{id:'x1',cat:'dados',track:'ana',kind:'quiz',mode:'bolso',q:'Uma tag de temperatura grava 1 ponto por segundo no historiador. Quantos pontos por ano, e o que fazer antes de levar para o notebook?',opts:['Cerca de 31,5 milhões; agregar ou reamostrar no servidor (média por minuto, por exemplo) antes de puxar','Cerca de 365 mil; puxar tudo cru','Cerca de 3 bilhões; impossível analisar','Cerca de 86 mil; não precisa tratar'],why:'86.400 por dia × 365 ≈ 31,5 milhões por tag. Com centenas de tags, puxar cru trava tudo. Historiadores e ferramentas como Seeq fazem a agregação perto do dado.',pro:'Em dado de sensor, eu agrego no historiador e trago só a resolução que a pergunta precisa.'},
{id:'x2',cat:'estat',track:'ds',kind:'quiz',mode:'trabalho',q:'Modelo de falha de bombas: com split aleatório a AUC é 0,95; com split por tempo cai para 0,78. Qual está certo?',opts:['O split por tempo: no aleatório, leituras quase iguais de horas vizinhas caem no treino e no teste, e o modelo “cola”','O aleatório, porque usa mais dados','Os dois estão errados','A diferença é ruído'],why:'Série temporal tem autocorrelação: o ponto das 10h se parece muito com o das 11h. Avaliação honesta treina no passado e testa no futuro, como vai ser em produção.',pro:'Em série temporal de sensor, eu valido treinando no passado e testando no futuro.'},
{id:'x3',cat:'negocio',track:'ml',kind:'quiz',mode:'reuniao',ctx:{who:'Engenheiro de processo do cliente',say:'Esse modelo de vocês é caixa-preta. Eu confio é no balanço de massa.'},q:'Resposta de quem trabalha em consultoria industrial:',opts:['“Faz sentido partir da física. O modelo híbrido usa o balanço de massa como base e o ML corrige o que ela não captura; te mostro o peso de cada variável e onde ele erra.”','“O ML é mais preciso que a física.”','“Não tem como explicar, mas funciona.”','“Se preferir, a gente desliga o modelo.”'],why:'Na indústria, confiança vem de respeitar o conhecimento do engenheiro. Modelos híbridos (física + ML) e explicações em variáveis de processo são o que destrava a adoção.',pro:'Na indústria, o ML entra corrigindo a física, não substituindo.'},
{id:'x4',cat:'dados',track:'ana',kind:'quiz',mode:'trabalho',q:'A leitura de pressão ficou exatamente em 31,20 bar por 6 horas seguidas, sem nenhuma variação. O que isso indica?',opts:['Provável sensor travado (valor congelado): tratar como falha de instrumento e confirmar com a instrumentação','Processo extremamente estável, ótimo sinal','Erro de arredondamento do historiador','Nada, é normal'],why:'Processo real sempre tem ruído. Valor idêntico por horas é assinatura de sensor congelado ou comunicação perdida. Usar isso no modelo ensina um comportamento falso.',pro:'Sinal sem nenhum ruído por horas, eu trato como falha de sensor até provar o contrário.'},
{id:'x5',cat:'negocio',track:'ml',kind:'quiz',mode:'trabalho',q:'Fim da alocação no cliente. O que não pode faltar na documentação do modelo entregue?',opts:['Tags de entrada, premissas físicas, como foi validado, faixa de operação em que vale, como monitorar e quando retreinar','Só o código no repositório','Um slide com a acurácia','O notebook de exploração'],why:'O cliente vai operar o modelo sem você. Sem faixa de validade e plano de monitoramento, a primeira mudança de processo quebra o modelo e a confiança.',pro:'Modelo entregue sem documentação de validade e monitoramento é um problema adiado.'},
{id:'x6',cat:'negocio',track:'ml',kind:'flip',mode:'entrevista',q:'“Explain data leakage in English, in three sentences.”',ans:'Data leakage happens when information that would not be available at prediction time ends up in the training data. The model looks great in validation but fails in production. To prevent it, I split the data before any processing, respect time order, and ask whether each feature would exist at the moment of the decision.',pro:'Would this feature exist at the moment of the decision?'},
{id:'x7',cat:'negocio',track:'ml',kind:'flip',mode:'entrevista',q:'“Como você explicaria um projeto de ML para um engenheiro de processo que não confia em modelos?”',ans:'Começo pelo problema dele, em unidades da planta, não pelo algoritmo. Mostro que o modelo parte da física que ele conhece e que o ML só corrige o que a física não captura. Apresento onde o modelo acerta e onde erra, com a faixa de operação em que ele vale. E proponho rodar em paralelo com o laboratório por algumas semanas antes de qualquer decisão.',pro:'Eu explico em unidades da planta e proponho rodar em paralelo antes de confiar.'},

/* ---- entrevista (flip) ---- */
{id:'f1',track:'ml',kind:'flip',q:'“Explique overfitting para alguém do negócio.”',ans:'É quando o modelo decora o passado em vez de aprender o padrão. Como um aluno que memoriza as respostas da prova antiga: tira 10 nela e vai mal na prova nova. Eu detecto comparando o desempenho em dados que o modelo nunca viu e corrijo simplificando o modelo, regularizando ou trazendo mais dados.'},
{id:'f2',track:'ml',kind:'flip',q:'“Como você escolheria o threshold de um classificador?”',ans:'Pelo custo de cada erro, não pelo 0,5 padrão. Levanto quanto custa um falso positivo e um falso negativo, calculo o custo esperado para vários thresholds no conjunto de validação e escolho o menor. Depois confirmo uma única vez no teste e monitoro em produção.'},
{id:'f3',track:'ia',kind:'flip',q:'“RAG ou fine-tuning? Quando cada um?”',ans:'RAG quando o problema é conhecimento: documentos que mudam, precisam de fonte e de controle de acesso. Fine-tuning quando o problema é comportamento: formato, tom, tarefa muito específica e repetitiva. Muitas vezes começo com RAG e bom prompt, meço, e só faço fine-tuning se a avaliação mostrar que falta comportamento.'},
{id:'f4',track:'ml',kind:'flip',q:'“Seu modelo tem 95% de acurácia. Isso é bom?”',ans:'Depende do baseline e do custo dos erros. Se 95% dos casos são da classe majoritária, um modelo que chuta sempre essa classe já faz 95%. Eu olharia a matriz de confusão, precisão e recall da classe que importa e compararia com a regra atual do negócio.'},
{id:'f5',track:'ds',kind:'flip',q:'“Como você valida um modelo de série temporal?”',ans:'Respeitando o tempo: treino no passado, valido no período seguinte, com janelas que avançam (walk-forward / TimeSeriesSplit). Nunca embaralho, e garanto que lags e médias móveis usem só informação disponível no momento da previsão. Comparo com um baseline ingênuo, como “mesmo valor da semana passada”.'},
{id:'f6',track:'ana',kind:'flip',q:'“Um KPI caiu 20% de ontem para hoje. Qual seu passo a passo?”',ans:'1) Confiro se é real: pipeline atrasou, filtro mudou, dia incompleto? 2) Comparo com sazonalidade (mesmo dia da semana passada). 3) Quebro por dimensão (canal, região, produto) para achar onde está a queda. 4) Cruzo com eventos (deploy, campanha, feriado). 5) Comunico o que sei, o que não sei e o próximo passo.'},
{id:'f7',track:'ds',kind:'flip',q:'“O que é data leakage? Dê um exemplo.”',ans:'É quando informação que não estaria disponível na hora da previsão entra no treino, e a métrica fica boa demais. Exemplo: normalizar antes de separar treino e teste, ou usar “data de cancelamento” para prever churn. Evito com Pipeline, split antes de qualquer fit e perguntando “eu teria esse dado no momento da decisão?”.'},
{id:'f8',track:'ia',kind:'flip',q:'“Como você mede se um sistema RAG está funcionando?”',ans:'Em duas camadas. Recuperação: um conjunto de perguntas com o trecho correto conhecido, medindo recall@k e MRR. Geração: fidelidade à fonte, se responde a pergunta e se cita certo, com revisão humana numa amostra e LLM-como-juiz calibrado contra essa revisão. E métricas de produção: latência, custo e feedback do usuário.'},

/* Guia de escrita dos cards: o mesmo padrão que ROUTINE.md usa na rotina diária */
const GEN_GUIDE=`Objetivo: que o conteúdo vire óbvio pela repetição em situações reais. Contexto do aluno: ele mira principalmente uma consultoria de engenharia e software para indústria pesada (séries temporais de sensores, soft sensors, manutenção preditiva, historiadores tipo PI, Seeq, clientes engenheiros, documentação, inglês) e, depois, fintech de crédito para PMEs e delivery AI-first. Em cerca de 1 a cada 3 cards, use cenas desses mundos. Todo card parte de uma cena concreta de trabalho no Brasil (varejo, banco, fintech, telecom, saúde, e-commerce, SaaS de suporte), com números realistas, e termina numa frase que o aluno pode repetir em reunião ou entrevista.

Gere exatamente 6 cards, todos sobre o tema:
1. 2 "quiz" com "mode":"reuniao" ou "trabalho": "ctx" é a fala de uma pessoa real (diretor, PM, CFO, gestor no Slack, engenheiro de dados). As alternativas são respostas possíveis. A certa responde com número, trade-off e próximo passo, em linguagem de negócio; as erradas são as respostas comuns de júnior (concordar sem checar, jargão sem tradução, "não dá", "vou investigar").
2. 1 "chain" com "mode":"entrevista": um gestor técnico pergunta e aprofunda em 3 rodadas de follow-up ("steps"), cada uma com 4 alternativas, como numa entrevista de verdade.
3. 1 "quiz" com "mode":"codigo": "code" com até 8 linhas de Python, pandas, SQL ou scikit-learn com um bug ou efeito surpreendente que acontece no trabalho real.
4. 1 "quiz" com "mode":"bolso": um número ou regra de bolso que um profissional sênior sabe de cabeça (ordem de grandeza, conta rápida, régua de interpretação), com a conta no "why". Se fizer sentido, inclua "chart" com dados realistas para interpretar.
5. 1 "flip" com "mode":"entrevista": pergunta aberta de gestor e "ans" com resposta modelo de até 90 palavras, estruturada (contexto, decisão, trade-off, resultado).
Regras para todos: a correta SEMPRE em opts[0]; as erradas são erros reais e plausíveis, nunca absurdas; "q" até 200 caracteres; "why" explica o porquê em até 60 palavras; "pro" é UMA frase de até 160 caracteres que o aluno pode dizer literalmente; conteúdo tecnicamente correto e atual; português do Brasil; sem markdown. Revise cada card: a alternativa em opts[0] precisa estar correta sem ambiguidade.

Responda só com um array JSON. Formatos:
{"kind":"quiz","mode":"reuniao","ctx":{"who":"Diretora comercial","say":"..."},"q":"Qual a melhor resposta?","opts":["certa","errada","errada","errada"],"why":"...","pro":"..."}
{"kind":"chain","mode":"entrevista","ctx":{"who":"Gestor de dados","say":"..."},"steps":[{"q":"...","opts":["certa","...","...","..."],"why":"..."},{"q":"...","opts":[...],"why":"..."},{"q":"...","opts":[...],"why":"..."}],"pro":"..."}
{"kind":"quiz","mode":"codigo","q":"...","code":"...","opts":[...],"why":"...","pro":"..."}
{"kind":"quiz","mode":"bolso","q":"...","opts":[...],"why":"...","pro":"...","chart":{"type":"bar","title":"...","labels":["Jan","Fev","Mar"],"series":[{"name":"Receita","values":[120,135,98]}]}}
{"kind":"flip","mode":"entrevista","q":"...","ans":"...","pro":"..."}
"chart" é opcional; type pode ser "bar", "line" ou "scatter" (em "scatter" use "points":[[x,y],...] com 8 a 40 pontos, "xLabel" e "yLabel"). Gráfico no estilo de Cole Knaflic: "title" é a CONCLUSÃO em uma frase (ex.: "Março caiu 27% depois da troca de fornecedor"), não a descrição; use "highlight":["rótulo"] para destacar só o que importa (o resto fica cinza); no máximo 2 séries.`;
const GKEY='sinapse.gen.v1';
let GEN=[];try{GEN=JSON.parse(localStorage.getItem(GKEY)||'[]');if(!Array.isArray(GEN))GEN=[]}catch(e){GEN=[]}
const gen={busy:false,backoff:0,fails:0,batches:0};
function persistGen(){for(let k=0;k<3;k++){try{localStorage.setItem(GKEY,JSON.stringify(GEN));return}catch(e){const old=GEN.filter(c=>ST.seen[c.id]).slice(0,150).map(c=>c.id);if(!old.length)return;GEN=GEN.filter(c=>!old.includes(c.id))}}}
function registerCard(c){if(!c||!c.id||byId[c.id])return false;CARDS.push(c);byId[c.id]=c;QUIZ.push(c);return true}
const sstr=(v,n)=>typeof v==='string'&&v.trim()?v.trim().slice(0,n):null;
function validChart(ch){if(!ch||typeof ch!=='object')return null;const type=['bar','line','scatter'].includes(ch.type)?ch.type:null;if(!type)return null;const title=sstr(ch.title,80)||'';
  if(type==='scatter'){const pts=(Array.isArray(ch.points)?ch.points:[]).filter(p=>Array.isArray(p)&&p.length>=2&&isFinite(p[0])&&isFinite(p[1])).slice(0,80).map(p=>[+p[0],+p[1]]);return pts.length>=4?{type,title,points:pts,xl:sstr(ch.xLabel,30)||'',yl:sstr(ch.yLabel,30)||''}:null}
  const labels=(Array.isArray(ch.labels)?ch.labels:[]).slice(0,14).map(l=>String(l).slice(0,14));if(labels.length<2)return null;
  const series=(Array.isArray(ch.series)?ch.series:[]).slice(0,3).map(s=>({name:sstr(s&&s.name,24)||'',values:(Array.isArray(s&&s.values)?s.values:[]).slice(0,labels.length).map(Number)})).filter(s=>s.values.length===labels.length&&s.values.every(v=>isFinite(v)));
  const hl=(Array.isArray(ch.highlight)?ch.highlight:[]).map(String).filter(x=>labels.includes(x)).slice(0,4);return series.length?{type,title,labels,series,...(hl.length?{hl}:{})}:null}
const MODES=['reuniao','entrevista','trabalho','codigo','conceito','bolso'];
function vctx(x){if(!x||typeof x!=='object')return null;const who=sstr(x.who,40),say=sstr(x.say,320);return who&&say?{who,say}:null}
function vstep(o){if(!o||typeof o!=='object')return null;const q=sstr(o.q,420),why=sstr(o.why,900),opts=(Array.isArray(o.opts)?o.opts:[]).map(x=>sstr(x,320)).filter(Boolean);return q&&why&&opts.length>=3&&opts.length<=4&&new Set(opts).size===opts.length?{q,opts,why}:null}
function validCard(o,track,b,topic){if(!o||typeof o!=='object')return null;const id='g'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);const base={id,cat:track,gen:1,b,topic};
  const extra={};if(MODES.includes(o.mode))extra.mode=o.mode;const cx=vctx(o.ctx);if(cx)extra.ctx=cx;const pro=sstr(o.pro,300);if(pro)extra.pro=pro;
  if(o.kind==='flip'){const q=sstr(o.q,260),ans=sstr(o.ans,900);return q&&ans?{...base,...extra,kind:'flip',q,ans}:null}
  if(o.kind==='chain'){const steps=(Array.isArray(o.steps)?o.steps:[]).slice(0,4).map(vstep);if(steps.length<2||steps.some(s=>!s))return null;return{...base,mode:'entrevista',...extra,kind:'chain',steps,q:cx?cx.say:steps[0].q}}
  const s=vstep(o);if(!s)return null;
  const c={...base,...extra,kind:'quiz',...s};const code=sstr(o.code,900);if(code)c.code=code;const ch=validChart(o.chart);if(ch){c.chart=ch;c.viz='gchart'}return c}
function chooseTopic(track){const cnt={};SYL[track].forEach(t=>cnt[t]=0);QUIZ.forEach(c=>{if(catOf(c)===track&&c.topic in cnt)cnt[c.topic]++});const low=SYL[track].slice().sort((a,b)=>cnt[a]-cnt[b]).slice(0,4);return low[Math.floor(Math.random()*low.length)]}
function trackAcc(track){let ok=0,bad=0;QUIZ.forEach(c=>{if(catOf(c)!==track)return;const a=ST.ans[c.id];if(a){ok+=a.ok;bad+=a.bad}});return ok+bad>=6?ok/(ok+bad):null}
const unseenFor=tr=>QUIZ.filter(c=>(tr==='all'||catOf(c)===tr)&&!ST.seen[c.id]).length;
const balancedTrack=()=>CAT_KEYS.slice().sort((a,b)=>unseenFor(a)-unseenFor(b))[0];
const pickGenTrack=()=>filter!=='all'?filter:balancedTrack();
/* Reserva offline: mantém ~40 min de cards não vistos, medidos pelo seu próprio ritmo por card */
const RESERVE_MIN=40;
const secPerCard=()=>clamp(ST.avgSec||30,10,120);
const reserveTarget=()=>Math.ceil(RESERVE_MIN*60/secPerCard());
const reserveMin=()=>Math.round(unseenFor('all')*secPerCard()/60);
function maybeGen(){if(!sampler||gen.busy||!ST.autoGen||Date.now()<gen.backoff||gen.batches>=60)return;if(!navigator.onLine)return;
  const tabLow=filter!=='all'&&unseenFor(filter)<12;if(!tabLow&&unseenFor('all')>=reserveTarget())return;generate(tabLow?filter:balancedTrack())}
let chipT=null;function genChip(msg,hideAfter){const el=$('#genchip');clearTimeout(chipT);if(!msg){el.hidden=true;return}el.className=hideAfter?'idle':'';el.innerHTML='<i></i><span></span>';el.querySelector('span').textContent=msg;el.hidden=false;if(hideAfter)chipT=setTimeout(()=>el.hidden=true,hideAfter)}
async function generate(track){if(!sampler||gen.busy)return;gen.busy=true;refreshGenUI();genChip(reserveMin()<RESERVE_MIN?`Montando reserva offline: ~${reserveMin()} de ${RESERVE_MIN} min…`:'Claude está escrevendo cards novos de '+CATS[track]+'…');
  const topic=chooseTopic(track),acc=trackAcc(track),level=acc===null?'iniciante a intermediário':acc>.8?'intermediário a avançado (o aluno acerta mais de 80%)':acc<.5?'iniciante, com exemplos bem concretos':'intermediário';
  const existing=QUIZ.filter(c=>catOf(c)===track).slice(-35).map(c=>'- '+c.q.slice(0,90)).join('\n');
  const prompt=`Você escreve cards de estudo para um app no formato de feed (estilo TikTok) que prepara pessoas para vagas de dados no Brasil: Analista de Dados/BI, Cientista de Dados, ML Engineer e AI Engineer. O aluno aprende melhor com código, casos reais de empresa e exemplos do que com fórmulas.

Categoria: ${CATS[track]}
Tema deste lote: ${topic}
Nível: ${level}

${GEN_GUIDE}
Não repita nem parafraseie estas perguntas que já existem:
${existing||'- (nenhuma)'}`;
  try{const out=await sampler.json(prompt,{modelTier:'default',cache:false});const arr=Array.isArray(out)?out:(out&&Array.isArray(out.cards)?out.cards:[]);const b='b'+Date.now().toString(36);
    const cards=arr.map(o=>validCard(o,track,b,topic)).filter(c=>c&&!QUIZ.some(x=>x.q===c.q));
    if(!cards.length)throw{code:'empty'};cards.forEach(registerCard);GEN.push(...cards);persistGen();cloudSaveBatch(b);gen.fails=0;gen.batches++;
    genChip(`+${cards.length} cards · reserva ~${Math.min(reserveMin(),RESERVE_MIN)} de ${RESERVE_MIN} min`,2800);
  }catch(e){const code=e&&e.code;gen.fails++;
    if(code==='not_granted'||code==='sampling_disabled'||code==='not_declared'||code==='capability_disabled'||code==='capability_removed'){ST.autoGen=false;save();genChip('Geração desligada: esta página não tem permissão para chamar o Claude.',4500)}
    else{gen.backoff=Date.now()+(code==='rate_limited'?90000:Math.min(300000,30000*gen.fails));genChip(code==='rate_limited'?'Limite de uso do Claude atingido. Tento de novo em alguns minutos.':'Não consegui gerar agora. Tento de novo daqui a pouco.',4000)}}
  gen.busy=false;refreshGenUI()}
let cloudQ=Promise.resolve();
function cloudSaveBatch(b){if(!colRef)return;cloudQ=cloudQ.then(()=>{const cs=GEN.filter(c=>c.b===b);return cs.length?colRef.doc('gen_'+b).set({at:Date.now(),cards:JSON.parse(JSON.stringify(cs))}):colRef.doc('gen_'+b).delete()}).catch(()=>{})}
async function loadCloudGen(){if(!colRef)return;try{const qs=await colRef.get();const have=new Set();let added=0;
  qs.docs.forEach(d=>{if(!d.id.startsWith('gen_'))return;have.add(d.id);((d.data()||{}).cards||[]).forEach(c=>{if(c&&c.id&&c.q&&!ST.hidden.includes(c.id)&&!byId[c.id]){registerCard(c);GEN.push(c);added++}})});
  if(added)persistGen();[...new Set(GEN.map(c=>c.b))].filter(b=>b&&!have.has('gen_'+b)).forEach(cloudSaveBatch);refreshGenUI();maybeGen()}catch(e){}}
function removeCard(id){const c=byId[id];if(!c)return;[CARDS,QUIZ].forEach(a=>{const i=a.indexOf(c);if(i>=0)a.splice(i,1)});delete byId[id];GEN=GEN.filter(x=>x.id!==id);ST.hidden.push(id);
  ['saved','errs','rev'].forEach(k=>ST[k]=ST[k].filter(x=>x!==id));sessRev=sessRev.filter(r=>r.id!==id);persistGen();save();if(c.b)cloudSaveBatch(c.b)}
function refreshGenUI(){document.querySelectorAll('.gen-toggle').forEach(b=>{b.setAttribute('aria-pressed',!!ST.autoGen);b.textContent=ST.autoGen?(gen.busy?'Gerando agora…':'Geração contínua ligada'):'Ativar geração contínua'});document.querySelectorAll('.gen-count').forEach(s=>s.textContent=GEN.length.toLocaleString('pt-BR'));document.querySelectorAll('.reserve-min').forEach(s=>s.textContent='~'+Math.min(reserveMin(),RESERVE_MIN));const gn=$('#genNow');if(gn)gn.disabled=gen.busy}
document.addEventListener('click',e=>{const b=e.target.closest('.gen-toggle');if(!b)return;ST.autoGen=!ST.autoGen;save();refreshGenUI();if(ST.autoGen){gen.backoff=0;gen.fails=0;generate(pickGenTrack())}else genChip('Geração contínua desligada. O feed segue com os cards que você já tem.',2600)});

/* Arquivo offline: a própria página + todos os cards gerados + seu progresso, num único .html */
function buildOffline(){const bundle=JSON.stringify({at:Date.now(),gen:GEN,state:ST}).replace(/</g,'\\u003c');
  const parts=SHELL.map(p=>p.tag==='SCRIPT'?`<script>window.SINAPSE_BUNDLE=${bundle};<\/script>\n`+p.html:p.html);
  return `<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>\n${parts.join('\n')}\n</body></html>`}
async function exportOffline(btn,msg){btn.disabled=true;msg.textContent='Montando o arquivo…';
  if(PWA){msg.textContent='Este app já abre sem internet: os cards ficam guardados no aparelho. Não precisa baixar nada.';btn.disabled=false;return}
  try{const dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null;if(!dl){msg.textContent=window.SINAPSE_BUNDLE?'Você já está na versão offline. Para atualizar, baixe de novo pelo link do Claude.':'Download indisponível nesta visualização.';btn.disabled=false;return}
    const html=buildOffline();await dl.save({filename:'sinapse-offline-'+today()+'.html',data:new Blob([html],{type:'text/html'})});msg.textContent=`Salvo: ${CARDS.length} cards (${GEN.length} gerados) e seu progresso. Abra o arquivo no navegador, sem internet.`}
  catch(e){const code=e&&e.code;msg.textContent=code==='declined'?'Download cancelado.':code==='rate_limited'?'Já existe um download aguardando confirmação.':'Não consegui salvar o arquivo agora.'}
  btn.disabled=false}

function tone(fs,dur=.08,type='sine',g=.06){if(!ST.sound)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const t0=AC.currentTime;fs.forEach((f,i)=>{const o=AC.createOscillator(),gn=AC.createGain();o.type=type;o.frequency.value=f;const s=t0+i*dur;gn.gain.setValueAtTime(0.0001,s);gn.gain.exponentialRampToValueAtTime(g,s+.012);gn.gain.exponentialRampToValueAtTime(.0001,s+dur*2.2);o.connect(gn).connect(AC.destination);o.start(s);o.stop(s+dur*2.4)})}catch(e){}}

const fx=$('#fx'),fctx=fx.getContext('2d');let parts=[];
function fitFx(){const d=Math.min(2,devicePixelRatio||1);fx.width=innerWidth*d;fx.height=innerHeight*d;fctx.setTransform(d,0,0,d,0,0)}
function burst(x,y,cols,n=26){if(reduced)n=8;for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=2+Math.random()*5;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2,life:1,c:cols[i%cols.length],r:2+Math.random()*3})}}
function confetti(){const cols=[C.spark,C.gold,C.ds,C.ia,C.ml];for(let i=0;i<(reduced?20:110);i++)parts.push({x:Math.random()*innerWidth,y:-10-Math.random()*200,vx:(Math.random()-.5)*2,vy:2+Math.random()*3,life:1.6,c:cols[i%5],r:3+Math.random()*3,sq:true})}
function drawFx(){fctx.clearRect(0,0,innerWidth,innerHeight);parts=parts.filter(p=>p.life>0);parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.15;p.vx*=.98;p.life-=.018;fctx.globalAlpha=Math.max(0,Math.min(1,p.life));fctx.fillStyle=p.c;if(p.sq)fctx.fillRect(p.x,p.y,p.r,p.r*1.6);else{fctx.beginPath();fctx.arc(p.x,p.y,p.r,0,7);fctx.fill()}});fctx.globalAlpha=1}
function floatXP(x,y,txt,gold){const d=document.createElement('div');d.className='float'+(gold?' gold':'');d.textContent=txt;d.style.left=x+'px';d.style.top=y+'px';document.body.appendChild(d);setTimeout(()=>d.remove(),1150)}

const bg=$('#bgnet'),bctx=bg.getContext('2d');let nodes=[],pulses=[],bgW=0,bgH=0;
function fitBg(){const d=Math.min(2,devicePixelRatio||1);bgW=innerWidth;bgH=innerHeight;bg.width=bgW*d;bg.height=bgH*d;bctx.setTransform(d,0,0,d,0,0);const lv=typeof levelInfo==='function'?levelInfo(ST.xp).L:1,n=Math.round(clamp(bgW*bgH/16000,28,70)+Math.min(40,(lv-1)*3));nodes=[...Array(n)].map(()=>({x:Math.random()*bgW,y:Math.random()*bgH,vx:(Math.random()-.5)*.15,vy:(Math.random()-.5)*.15}))}
function neighbors(i,R){const a=nodes[i];return nodes.map((b,j)=>({j,d:Math.hypot(a.x-b.x,a.y-b.y)})).filter(o=>o.j!==i&&o.d<R).map(o=>o.j)}
function fire(color,hops=7){const R=Math.max(140,Math.min(bgW,bgH)*.22);let cur=Math.floor(Math.random()*nodes.length),path=[cur];for(let k=0;k<hops;k++){const nb=neighbors(cur,R).filter(j=>!path.includes(j));if(!nb.length)break;cur=nb[Math.floor(Math.random()*nb.length)];path.push(cur)}if(path.length>1)pulses.push({path,p:0,color})}
function drawBg(){bctx.clearRect(0,0,bgW,bgH);const R=Math.max(140,Math.min(bgW,bgH)*.22);
  if(!reduced)nodes.forEach(n=>{n.x+=n.vx;n.y+=n.vy;if(n.x<0||n.x>bgW)n.vx*=-1;if(n.y<0||n.y>bgH)n.vy*=-1});
  for(let i=0;i<nodes.length;i++)for(let j=i+1;j<nodes.length;j++){const a=nodes[i],b=nodes[j],d=Math.hypot(a.x-b.x,a.y-b.y);if(d<R){bctx.strokeStyle=hexA(C.ds,.07*(1-d/R));bctx.lineWidth=1;bctx.beginPath();bctx.moveTo(a.x,a.y);bctx.lineTo(b.x,b.y);bctx.stroke()}}
  nodes.forEach(n=>{bctx.fillStyle=hexA(C.ds,.25);bctx.beginPath();bctx.arc(n.x,n.y,1.6,0,7);bctx.fill()});
  pulses=pulses.filter(p=>p.p<p.path.length-1);pulses.forEach(p=>{p.p+=reduced?.5:.06;const k=Math.floor(p.p),f=p.p-k;for(let s=0;s<=k&&s<p.path.length-1;s++){const a=nodes[p.path[s]],b=nodes[p.path[s+1]];const e=s<k?1:f;bctx.strokeStyle=hexA(p.color,.55*(1-(k-s)/p.path.length));bctx.lineWidth=2;bctx.beginPath();bctx.moveTo(a.x,a.y);bctx.lineTo(a.x+(b.x-a.x)*e,a.y+(b.y-a.y)*e);bctx.stroke()}
    if(k<p.path.length-1){const a=nodes[p.path[k]],b=nodes[p.path[k+1]];const x=a.x+(b.x-a.x)*f,y=a.y+(b.y-a.y)*f;const g=bctx.createRadialGradient(x,y,0,x,y,16);g.addColorStop(0,hexA(p.color,.9));g.addColorStop(1,hexA(p.color,0));bctx.fillStyle=g;bctx.beginPath();bctx.arc(x,y,16,0,7);bctx.fill()}});
}

const IVL=[0,1,3,7,16,35];
const addDays=n=>{const d=new Date();d.setDate(d.getDate()+n);return dayStr(d)};
const sessShown=new Set();
const dueCards=()=>QUIZ.filter(c=>{const a=ST.ans[c.id];return a&&a.ok>0&&(a.due||'0000-00-00')<=today()&&!ST.rev.includes(c.id)&&!sessShown.has(c.id)});
function record(c,ok){const a=ST.ans[c.id]||{ok:0,bad:0,box:0};const dl=dayLog();if(ok)dl.ok++;else dl.bad++;if(ok){a.ok++;a.box=Math.min(5,a.box+1);ST.ok++;sess.ok++;ST.rev=ST.rev.filter(id=>id!==c.id)}else{a.bad++;a.box=0;ST.bad++;sess.bad++;if(!ST.rev.includes(c.id))ST.rev.push(c.id);ST.errs=[c.id,...ST.errs.filter(x=>x!==c.id)].slice(0,60);sessRev.push({id:c.id,at:fc+4})}a.due=ok?addDays(IVL[a.box]):today();ST.ans[c.id]=a;sessShown.add(c.id);ST.seen[c.id]=1;save()}

function answer(item,btn){if(item.done)return;item.done=true;const c=item.c,el=item.el,oi=+btn.dataset.oi,ok=oi===0;

  else{combo=0;sfx.bad();buzz([40,30,40]);hud()}

async function explain(item,out,btn){if(!sampler)return;const c=item.c;btn.disabled=true;out.hidden=false;out.textContent='Pensando…';
  const ctx=c.kind==='chain'?`Entrevista. ${c.ctx?c.ctx.who+': '+c.ctx.say:''}\n${c.steps.map((s,k)=>`Rodada ${k+1}: ${s.q}\nResposta certa: ${s.opts[0]}\nPor quê: ${s.why}`).join('\n')}`:c.kind==='sim'?`Tema: ${c.title}. Contexto: ${c.hook.replace(/<[^>]+>/g,'')}`:c.kind==='flip'?`Pergunta de entrevista: ${c.q}\nResposta modelo: ${c.ans}`:`Pergunta: ${c.q}\nResposta correta: ${c.opts[0]}\nExplicação original: ${c.why}${item.picked&&item.picked!==c.opts[0]?`\nO aluno escolheu (errado): ${item.picked}`:''}`;
  const prompt=`Você é um professor de dados muito didático. Explique de outro jeito, em português do Brasil, em no máximo 110 palavras, para alguém que aprende melhor com código do que com fórmula. Use uma analogia do dia a dia de suporte ou de uma loja, e, se fizer sentido, um trecho curto de Python ou SQL. Sem títulos nem markdown pesado.\n\n${ctx}`;
  try{const r=await sampler(prompt,{modelTier:'quick',onText:({text})=>{out.textContent=text}});out.textContent=r.text||out.textContent}
  catch(e){const code=e&&e.code;out.textContent=code==='rate_limited'?'Muitas perguntas seguidas. Tente de novo em alguns segundos.':code==='not_granted'?'Sem permissão para chamar o Claude nesta página.':'Não consegui gerar outra explicação agora.';if(code==='not_granted')document.body.classList.remove('ai-on')}
  btn.disabled=false}

let feedList=[],filter='all',fc=0,sinceBreak=0,recent=[],pendingFollow=null,sessRev=[],cur=null,dwellT=null,curStart=0;
ST.rev.forEach((id,i)=>{if(byId[id])sessRev.push({id,at:2+i*3})});
const eligible=c=>c&&c.kind!=='intro'&&c.kind!=='break'&&(filter==='all'||catOf(c)===filter);
function pick(){
  if(sinceBreak>=25){sinceBreak=0;return{c:{id:'break'+fc,kind:'break',track:'neuro'}}}
  if(pendingFollow){const c=byId[pendingFollow];pendingFollow=null;if(eligible(c)&&!recent.includes(c.id))return{c,gold:Math.random()<.12}}
  const di=sessRev.findIndex(r=>r.at<=fc&&eligible(byId[r.id])&&!recent.slice(-3).includes(r.id));if(di>=0){const r=sessRev.splice(di,1)[0];return{c:byId[r.id],review:true}}
  if(Math.random()<.3){const d=dueCards().filter(c=>eligible(c)&&!recent.includes(c.id));if(d.length){const c=d[Math.floor(Math.random()*d.length)];sessShown.add(c.id);return{c,review:'spaced'}}}
  let pool=CARDS.filter(c=>eligible(c)&&!recent.includes(c.id));if(!pool.length)pool=CARDS.filter(eligible);
  const slot=fc%3;let want=slot===0?pool.filter(c=>c.kind==='sim'):pool.filter(c=>c.kind!=='sim');if(!want.length)want=pool;
  const unseen=want.filter(c=>!ST.seen[c.id]),src=unseen.length?unseen:want;
  const ws=src.map(c=>{const a=ST.ans[c.id];return unseen.length?1:1/(1+(a?a.box:0))});let r=Math.random()*ws.reduce((a,b)=>a+b,0),i=0;while(i<src.length-1&&r>ws[i]){r-=ws[i];i++}
  const c=src[i];return{c,gold:c.kind!=='sim'&&Math.random()<.12}}
function append(n){for(let k=0;k<n;k++){const it=pick();if(it.c.kind!=='break'){recent.push(it.c.id);if(recent.length>14)recent.shift();if(it.c.follow)pendingFollow=it.c.follow}sinceBreak++;fc++;mount(it)}}
function resetFeed(){feedList.forEach(it=>{visObs.unobserve(it.el);nearObs.unobserve(it.el)});$('#feed').innerHTML='';feedList=[];fc=0;recent=[];pendingFollow=null;cur=null;append(8);$('#feed').scrollTo({top:0,behavior:'auto'})}

const visObs=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting&&e.intersectionRatio>=.6){const it=feedList.find(x=>x.el===e.target);if(it&&it!==cur)setCurrent(it)}})},{root:$('#feed'),threshold:[.6]});
const nearObs=new IntersectionObserver(es=>{es.forEach(e=>{if(!e.isIntersecting)return;const it=feedList.find(x=>x.el===e.target);if(it&&!it.viz&&it.c.viz)initViz(it)})},{root:$('#feed'),rootMargin:'0px 0px 150% 0px'});
function setCurrent(it){const now=performance.now();if(cur&&curStart&&cur.c.kind!=='intro'&&cur.c.kind!=='break'){const d=(now-curStart)/1000;if(d>=4&&d<=180)ST.avgSec=ST.avgSec?ST.avgSec*.9+d*.1:d}curStart=now;
  cur=it;clearTimeout(dwellT);
  if(it.c.kind==='flip'&&!it.cdT){const cd=it.el.querySelector('.cd');let t=30;if(cd)it.cdT=setInterval(()=>{t--;if(!cd.isConnected||t<0){clearInterval(it.cdT);return}cd.textContent=t?t+'s':'tempo!'},1000)}const idx=feedList.indexOf(it);if(idx>=feedList.length-4)append(8);maybeGen();
  if(it.c.kind!=='intro'&&it.c.kind!=='break'&&!sess.seen.has(it.el)){sess.seen.add(it.el);sess.cards++}
  if(it.c.kind==='sim'&&!sess.seen.has(it.c.id)){dwellT=setTimeout(()=>{if(cur===it&&!sess.seen.has(it.c.id)){sess.seen.add(it.c.id);ST.seen[it.c.id]=1;award(5,it.el.querySelector('h2'))}},3000)}}
function initViz(it){const host=it.el.querySelector('.viz');if(!host)return;const c=document.createElement('canvas');host.appendChild(c);const ctx=c.getContext('2d');const S={c,ctx,w:0,h:0};
  const fit=()=>{const r=host.getBoundingClientRect();const d=Math.min(2,devicePixelRatio||1);if(r.width<2||r.height<2)return;S.w=r.width;S.h=r.height;c.width=Math.round(r.width*d);c.height=Math.round(r.height*d);c.style.width=r.width+'px';c.style.height=r.height+'px';ctx.setTransform(d,0,0,d,0,0);if(it.viz)it.viz.draw(performance.now(),0)};
  fit();let touched=false;const touch=()=>{if(touched)return;touched=true;award(3,host)};
  try{it.viz=VIZ[it.c.viz]({S,ctrl:it.el.querySelector('.ctrl'),card:it.el,touch,data:it.c.chart});it.viz.draw(performance.now(),0)}catch(e){console.error('[sinapse] viz',it.c.viz,e)}
  new ResizeObserver(fit).observe(host)}

/* ================= loop ================= */
let lastT=performance.now();
function loop(t){const dt=Math.min(64,t-lastT);lastT=t;if(cur&&cur.viz){try{cur.viz.draw(t,dt)}catch(e){}}drawBg();if(parts.length)drawFx();else if(fx._dirty!==false){fctx.clearRect(0,0,innerWidth,innerHeight);fx._dirty=false}if(parts.length)fx._dirty=true;requestAnimationFrame(loop)}

function caseSetup(d,scene){const ds=dataOf(d),f=factsOf(d);return `Você é o motor de uma simulação imersiva de trabalho que treina um profissional de dados no Brasil. Você interpreta TODOS os personagens do caso e um narrador. O jogador é a pessoa do outro lado: nunca escreva falas, decisões ou pensamentos do jogador.

Empresa: ${d.company}
Papel do jogador: ${d.player}
Situação: ${d.situation}
Objetivo do jogador: ${d.objective}
Etapas: ${d.stages.map((s,i)=>`${i+1}. ${s}`).join(' | ')}
Personagens: ${d.cast.map(p=>`${p.name} (${p.role}): ${p.style}`).join(' | ')}
Fatos ocultos (revele só quando o jogador investigar, perguntar ou pedir os dados certos; nunca entregue de graça): ${d.hidden.join(' | ')}
Dificuldade: ${TIER_TXT[tier(d)]}.
${d.relations?`Relação dos personagens com o jogador (0 a 100) e o que lembram dele: ${d.relations}\n`:''}${ds?`
DADOS REAIS: o jogador tem acesso a um banco SQL de verdade com estas tabelas e roda consultas sozinho:
${schemaText(d)}
Números verdadeiros desses dados (use-os; nunca contradiga): ${f.join(' | ')}
Quando o jogador pedir dados a alguém, o personagem diz onde estão (qual tabela) ou manda um recorte pequeno, como na vida real; o raciocínio e as contas são do jogador. Quando ele trouxer um resultado de consulta, reajam ao que ele mostrou.
`:''}
A interface: o jogador usa o chat corporativo da empresa. Existem conversas privadas entre o jogador e cada personagem, e um grupo chamado "${groupName(d)}" com todos. Toda mensagem do jogador chega marcada com o lugar: [Privado com Nome], [No grupo ...], [Na reunião], ou é um evento entre colchetes (ex.: [Você ligou para Nome], [Você convocou uma reunião com o grupo agora], [Você saiu da reunião]).
- Cada personagem só sabe o que viu ou ouviu. O que o jogador disse em privado a uma pessoa, as outras não sabem, a menos que alguém conte.
- Em cada mensagem sua informe "where": o nome do personagem (é a conversa privada dele com o jogador), "grupo", ou "reuniao".
- Personagens podem mandar mensagem por iniciativa própria em outra conversa quando fizer sentido (gestor cobrando prazo, colega respondendo mais tarde, alguém repassando informação).
- Reunião ou conversa ao vivo: quando a história pedir (reunião marcada chegou, apresentação, conversa presencial, chamada aceita), devolva "scene":{"mode":"meeting","title":"...","participants":["nomes de quem está presente"]} e as falas com "where":"reuniao". Uma chamada pode ser recusada de forma realista. Na reunião todos os presentes ouvem tudo, conversam entre si e reagem em tempo real.
- Quando a reunião terminar, devolva "scene":{"mode":"chat"}. Sem mudança de cena, use "scene":null.
- ENTREGÁVEIS: nos momentos-chave, um personagem pede algo escrito (mensagem para a diretoria, e-mail, resumo executivo, documentação técnica, comentário de revisão). O jogador manda com a marcação [Entregável: tipo para destino]. Reaja à qualidade de verdade: texto vago, sem número ou sem próximo passo gera cobrança ("qual o número?", "e o que você recomenda?"); texto claro e bem estruturado destrava a etapa e gera reconhecimento.
${scene&&scene.mode==='meeting'?`Cena inicial: reunião ao vivo "${scene.title}" com ${scene.participants.join(', ')}.`:'Cena inicial: chat corporativo.'}

Como conduzir:
- Realismo de empresa brasileira: cada pessoa tem agenda, pressa, humor e interesses próprios; interrompe, pede números, resiste a mudanças, muda de assunto, elogia quando merecido. Linguagem natural de chat e de reunião, em português do Brasil (personagens que falam outra língua falam nela).
- Reaja à ação do jogador de forma coerente. Boas ações (perguntar a decisão, checar dados, propor número e próximo passo, respeitar as pessoas, falar com a pessoa certa no canal certo) destravam informação e confiança. Ações fracas (jargão sem tradução, prometer o impossível, culpar alguém em público, chutar) trazem consequências realistas, mas sempre dão chance de recuperar.
- Use o narrador ("who":"narrador") para passagem de tempo e contexto.
- "stage" é a etapa em andamento (1 a ${d.stages.length}). Avance quando o objetivo da etapa atual for cumprido. "done": true quando todas as etapas forem cumpridas ou quando o caso fracassar de forma irreversível (explique pelo narrador).
- Se a mensagem do jogador for "[DICA]", responda só com {"who":"mentor","where":"mentor","text":"..."}: uma dica curta e socrática, sem dar a resposta pronta. O mentor está fora da cena.
- Mensagens curtas como chat real: 1 a 4 mensagens por turno, cada uma com até 3 frases (artefatos podem ser maiores). Em reunião, até 5 falas.
- AVALIAÇÃO SILENCIOSA (o jogador não vê): avalie SÓ a última ação do jogador (mensagem, consulta trazida, entregável, ligação, reunião convocada). Em "aval", para cada competência que essa ação exercitou, dê 0 (prejudicou: chute, culpa, jargão, conclusão errada), 1 (fraca), 2 (adequada) ou 3 (de sênior); use null para o que não foi exercitado. dados = SQL, dados, qualidade e engenharia; estat = raciocínio estatístico, causalidade, validação; modelo = modelagem e IA; negocio = comunicação, pessoas, canal certo, decisão, prioridade. Em "obs", uma frase curta e concreta sobre o raciocínio dessa jogada (ex.: "Pediu a definição de receita antes de investigar"). Para "[DICA]", use "aval":null e "obs":"".

Responda SEMPRE só com JSON neste formato:
{"msgs":[{"who":"nome do personagem, narrador ou mentor","where":"nome do personagem, grupo, reuniao ou mentor","text":"..."}],"stage":1,"done":false,"scene":null,"aval":{"dados":null,"estat":null,"modelo":null,"negocio":2},"obs":"..."}`}

const CASE_JSON=lvl=>`{"title":"...","level":"${lvl}","cat":"dados|estat|modelo|negocio","setting":"...","company":"...","player":"Você é ...","cast":[{"name":"...","role":"...","style":"..."}],"group":"nome curto do grupo do projeto","situation":"...","objective":"...","stages":["..."],"hidden":["..."],"scene":{"mode":"meeting","title":"...","participants":["..."]},"opening":[{"who":"narrador","where":"...","text":"..."},{"who":"<nome de um personagem>","where":"...","text":"..."}],"data":{"tables":[{"name":"nome_snake","columns":["col_a","col_b"],"rows":[["valor",1]]}],"facts":["números verdadeiros que as tabelas mostram"]}}`;
const CASE_RULES=`O jogador usa o chat corporativo da empresa (conversas privadas com cada personagem e um grupo do projeto) e às vezes entra em reuniões ao vivo. Se o caso começa numa reunião, entrevista ou conversa presencial, inclua "scene" com os participantes; senão omita "scene". A abertura tem 1 mensagem do narrador situando a cena e 1 ou 2 falas que já colocam o problema, cada uma com "where" (o nome de quem manda, no privado com o jogador; "grupo"; ou "reuniao" se começar ao vivo).
Se o problema for de dados (análise, métrica, modelo), inclua "data": 1 a 3 tabelas pequenas (até 80 linhas cada, colunas em snake_case) com números coerentes, em que os fatos ocultos possam ser DESCOBERTOS com SQL (agrupar, filtrar, comparar). "facts" resume os números verdadeiros. Se o caso for só de conversa, omita "data".`;
async function genCase(){if(!sampler||caseBusy)return;const work=genCaseOpt.setting===4;if(work&&genCaseOpt.work.trim().length<30){genChip('Descreva a situação do trabalho com um pouco mais de detalhe.',3000);return}
  caseBusy=true;renderCases();
  const lvl=LEVELS[genCaseOpt.level],cat=genCaseOpt.cat?CAT_KEYS[genCaseOpt.cat-1]:CAT_KEYS[Math.floor(Math.random()*4)],set=SETTINGS[genCaseOpt.setting];
  const prev=[...CASES,...(ST.genCases||[])].map(c=>'- '+c.title).join('\n');
  const prompt=`Crie um caso de simulação de trabalho para treinar um profissional de dados no Brasil.
Nível do jogador: ${lvl}. Foco de competência: ${CATS[cat]}. ${work?`Base: uma situação real que o jogador viveu no trabalho dele. Mantenha a essência do problema, mas troque nomes de pessoas, empresa e clientes:\n"""${genCaseOpt.work.slice(0,1500)}"""`:`Tipo de situação: ${set}.`}
Contexto do jogador: mira vagas em consultoria industrial (séries temporais de sensores, soft sensors, manutenção preditiva, historiadores tipo PI, Seeq, clientes engenheiros), fintech de crédito para PMEs e delivery AI-first. Prefira esses mundos quando fizer sentido.
O caso precisa ser realista e do dia a dia: empresa brasileira plausível, problema concreto com números, 2 a 4 personagens com personalidades e interesses diferentes (pelo menos um com algum conflito ou resistência), 3 a 5 etapas que levam ao objetivo, e 3 a 5 fatos ocultos que o jogador só descobre investigando ou perguntando bem.
${CASE_RULES}
Não repita estes casos:
${prev}
Responda só com JSON:
${CASE_JSON(lvl)}`;
  try{const o=await sampler.json(prompt,{modelTier:'default',cache:false});const d=validCase(o);if(!d)throw{code:'invalid'};if(!o.cat)d.cat=cat;ST.genCases=[...(ST.genCases||[]),d].slice(-8);save();caseBusy=false;startCase(d)}
  catch(e){caseBusy=false;genChip(e&&e.code==='rate_limited'?'Limite de uso do Claude. Tente de novo em alguns minutos.':'Não consegui criar o caso agora. Tente de novo.',3500);renderCases()}}

async function genCareerCase(){if(!sampler||caseBusy||!ST.career)return;caseBusy=true;renderCases();const c=ST.career,co=COMPANIES[c.co],lv=c.level;
  const weak=CAT_KEYS.slice().sort((x,y)=>(skillAvg(x)??-1)-(skillAvg(y)??-1)),focus=Math.random()<.6?weak[0]:CAT_KEYS[Math.floor(Math.random()*4)];
  const kinds=['tático, com dados para investigar','conversa difícil ou social','reunião com cliente ou liderança','entrega com prazo e documentação'],kind=kinds[c.hist.length%kinds.length];
  const rel=co.cast.map(p=>`${p.name} (${p.role}): ${c.rep[p.name]??50}`).join('; '),mem=c.hist.slice(-8).map(h=>`- ${h.title}: ${h.memo}`).join('\n');
  const prompt=`Crie o próximo caso do MODO CARREIRA de um profissional de dados na empresa fictícia abaixo. Os casos são capítulos de uma mesma história: as pessoas se lembram do que aconteceu.
Empresa: ${co.name}. ${co.desc}
Elenco fixo (use 2 a 4 dessas pessoas; pode incluir no máximo 1 pessoa nova, como um cliente): ${co.cast.map(p=>`${p.name}, ${p.role}: ${p.style}`).join(' | ')}
Cargo atual do jogador: ${CAREER_LEVELS[lv]} (${LEVEL_SCOPE[lv]}). O caso deve exigir exatamente as responsabilidades desse cargo.

O que já aconteceu (as pessoas lembram e podem citar):
${mem||'- Primeira semana do jogador na empresa.'}
Foco de competência deste caso: ${CATS[focus]}. Tipo de dia: ${kind}.
${CASE_RULES}
Responda só com JSON:
${CASE_JSON(CAREER_LEVELS[lv])}`;
  try{const o=await sampler.json(prompt,{modelTier:'default',cache:false});const d=validCase(o);if(!d)throw{code:'invalid'};d.career=true;d.cat=CAT_KEYS.includes(o.cat)?o.cat:focus;d.level=CAREER_LEVELS[lv];d.company=co.name+(d.company&&!d.company.includes(co.name)?' · '+d.company:'');

function capHTML(m){const d=ST.activeCase.def;if(m.me)return`<div class="cap me"><b>Você${m.deliv?' · '+esc(m.deliv):''}</b>${fmtMsg(m.text)}</div>`;const w=(m.who||'').toLowerCase();

async function playMsgs(msgs){const a=ST.activeCase;
  for(const raw of msgs){const m={who:raw.who,text:raw.text,where:normWhere(a,raw)};const w=m.who.toLowerCase();
    if(m.where==='reuniao'){m.meet=a.meet;if(w!=='narrador'&&caseView==='chat'){speak(m.who,true);await sleep(Math.min(2400,600+m.text.length*13));addLog(m);await sleep(350);speak(m.who,false)}else addLog(m)}
    else{m.meet=0;if(m.where===MENTOR&&a.scene.mode==='meeting')m.meetHint=a.meet;
      const visible=caseView==='chat'&&(a.scene.mode==='meeting'?m.where===MENTOR:m.where===a.thread&&a.view==='thread');
      if(visible&&w!=='narrador'&&w!=='mentor'){const t=typing(m.who);await sleep(Math.min(2200,500+m.text.length*12));if(t)t.remove()}
      addLog(m);if(!visible&&m.where!==MENTOR){a.unread[m.where]=(a.unread[m.where]||0)+1;const l=$('#tmList');if(l)l.innerHTML=listHTML(a);if(w!=='narrador')toast(a,m)}}
    sfx.tick()}}

async function sendCase(text,kind='msg',opt={}){const a=ST.activeCase;if(!a||a.done||caseBusy||!sampler)return;text=(text||'').trim();if(!text)return;
  const inMeet=a.scene.mode==='meeting',ta=$('#cvText');
  const prefix=inMeet?'[Na reunião] ':a.thread===GROUP?`[No grupo ${groupName(a.def)}] `:`[Privado com ${a.thread}] `;
  const content=kind==='hint'?'[DICA]':kind==='event'?text:opt.content?(inMeet?'[Na reunião] ':prefix)+opt.content:prefix+text;
  let mine=null;if(kind==='msg'){mine={me:true,text,where:inMeet?'reuniao':a.thread,meet:inMeet?a.meet:0};if(opt.deliv)mine.deliv=opt.deliv;addLog(mine);if(ta&&!opt.deliv&&!opt.display){ta.value='';ta.style.height='auto'}}
  if(kind==='hint'&&hintCost(a.def)){award(-hintCost(a.def),$('#cvStage'))}
  caseBusy=true;lockChat(true);buzz(10);a.api.push({role:'user',content});
  const who=kind==='hint'?'Mentor':inMeet?(a.scene.participants[0]):(a.thread===GROUP?(a.def.cast[0]||{}).name:a.thread);
  const tip=kind==='hint'&&!inMeet&&a.thread!==MENTOR?null:typing(who);
  try{const r=await sampler.json(a.api,{modelTier:'default',cache:false});if(tip)tip.remove();
    const msgs=vmsgs(r&&r.msgs),sc=vscene(a.def,r&&r.scene);if(!msgs.length&&!sc)throw{code:'empty'};
    if(kind!=='hint')recordSignal(a,r&&r.aval,r&&r.obs);
    a.api.push({role:'assistant',content:JSON.stringify({msgs,stage:r.stage,done:!!r.done,scene:sc})});
    if(kind==='hint'&&!inMeet&&a.thread!==MENTOR){a.thread=MENTOR;a.view='thread';renderTeams()}
    if(sc&&sc.mode==='meeting'&&!inMeet)await enterMeeting(sc);
    await playMsgs(msgs);
    const ns=clamp(parseInt(r.stage,10)||a.stage,1,a.def.stages.length),adv=ns>a.stage;if(adv){award(15*(ns-a.stage),$('#cvStage'));fire(C.spark)}a.stage=Math.max(a.stage,ns);
    if(sc&&sc.mode==='chat'&&a.scene.mode==='meeting')await exitMeeting();
    if(r.done){a.done=true;updStage();save();caseBusy=false;await endCase();return}
    updStage();save();if(adv){caseBusy=false;lockChat(false);setTimeout(()=>{if(caseView==='chat'&&!a.done&&!$('#caseOv'))openHyp(true)},900);return}}
  catch(e){if(tip)tip.remove();a.api.pop();
    if(mine){const i=a.log.lastIndexOf(mine);if(i>=0)a.log.splice(i,1);if(opt.deliv)a.delivs.pop();if(caseView==='chat'){renderChat();const t=$('#cvText');if(t&&!opt.deliv)t.value=text}}
    const note={who:'sistema',text:e&&e.code==='rate_limited'?'Limite de uso do Claude. Espere um pouco e tente de novo.':`A cena não respondeu.${opt.deliv?' Seu entregável não foi enviado; copie o texto antes de tentar de novo.':' Sua mensagem voltou para a caixa; envie de novo.'}`,where:inMeet?'reuniao':a.thread,meet:inMeet?a.meet:0};
    addLog(note);a.log.splice(a.log.indexOf(note),1)}
  caseBusy=false;lockChat(a.done)}

/* ---------- leitura contínua do raciocínio ---------- */
function liveSkill(k){const l=(ST.live||{})[k];return l&&l.n?l.v:skillAvg(k)}
function feedLive(k,v5,w){ST.live=ST.live||{};const l=ST.live[k]||{v:v5,n:0,last:0};l.v=l.n?l.v*(1-w)+v5*w:v5;l.n++;l.last=Date.now();ST.live[k]=l}
function recordSignal(a,av,obs){if(!av||typeof av!=='object')return;const got=[];CAT_KEYS.forEach(k=>{const v=av[k];if(v==null||!isFinite(v))return;const x=clamp(Math.round(+v),0,3);got.push([k,x]);feedLive(k,x*5/3,.22)});if(!got.length)return;
  const o=sstr(obs,200)||'';a.signals=a.signals||[];a.signals.push({t:Date.now(),s:Object.fromEntries(got),o,stage:a.stage});if(a.signals.length>80)a.signals.shift();
  const top=got.slice().sort((x,y)=>Math.abs(y[1]-1.5)-Math.abs(x[1]-1.5))[0];
  ST.liveLog=[{k:top[0],v:top[1],o,case:a.def.title,date:today()},...(ST.liveLog||[])].slice(0,30);save();
  if(caseView==='chat'){renderStrip(top[0]);if(o)signalToast(top[0],top[1],o);const il=document.querySelector('.tm-info .infolog');if(il)il.innerHTML=(a.signals||[]).slice(-4).reverse().map(x=>x.o?`<p>${esc(x.o)}</p>`:'').join('')}layoutPanels()}
function caseAvg(a,k){const xs=(a.signals||[]).map(s=>s.s[k]).filter(v=>v!=null);return xs.length?xs.reduce((p,c)=>p+c,0)/xs.length:null}
function renderStrip(pulse){const a=ST.activeCase,els=document.querySelectorAll('.nstrip');if(!a||!els.length)return;const col={dados:'var(--cat-dados)',estat:'var(--cat-estat)',modelo:'var(--cat-modelo)',negocio:'var(--cat-negocio)'};
  const html=CAT_KEYS.map(k=>{const v=caseAvg(a,k);return`<i class="${k===pulse?'fire':''}${v==null?' off':''}" style="--nc:${col[k]};--ns:${v==null?0:(v/3)}" title="${CATS[k]}: ${v==null?'ainda sem sinal neste caso':['prejudicou','fraco','adequado','de sênior'][Math.round(v)]}"></i>`}).join('');els.forEach(el=>el.innerHTML=html)}
function signalToast(k,v,o){const box=$('#cases');if(!box)return;const el=document.createElement('div');el.className='tm-toast sig';el.style.setProperty('--pc',`var(--cat-${k})`);
  el.innerHTML=`<b>${v>=2?'↑':v===1?'→':'↓'} ${esc(CATS[k])} · ${['prejudicou','fraco','adequado','de sênior'][v]}</b><span>${esc(o)}</span>`;box.appendChild(el);setTimeout(()=>el.remove(),3600)}

  const s=$('#cvStage');if(s)s.textContent=a.done?'caso encerrado':`etapa ${st} de ${n} · ${d.stages[st-1]}`;

async function endCase(){const a=ST.activeCase;if(!a||caseBusy||!sampler)return;if(a.debrief){caseView='debrief';renderDebrief();return}caseBusy=true;lockChat(true);

  const transcript=a.log.filter(m=>m.who!=='sistema').map(m=>`[${where(m)}] ${m.me?'JOGADOR'+(m.deliv?' (entregável: '+m.deliv+')':''):m.who.startsWith('_')?'JOGADOR':m.who}: ${m.text}`).join('\n').slice(-18000);

const POST_RULES=`Regras do post:
- Português do Brasil, primeira pessoa, tom humilde e concreto, como um profissional em transição para dados que estuda em público.
- Deixe claro que foi um caso SIMULADO de estudo (ex.: "Hoje pratiquei um caso simulado em que..."). Nunca apresente como experiência profissional real, nunca invente empresa, cliente, cargo ou resultado real.
- Não cite a empresa onde a pessoa trabalha, nomes de pessoas nem dados pessoais. Os nomes do caso são fictícios: não use.
- Estrutura: 1 linha de gancho concreta; o problema em 1 a 2 frases; o raciocínio ou a técnica que destravou, explicado de forma simples (um termo técnico no máximo, explicado); 1 dica prática que outra pessoa pode usar amanhã; uma pergunta curta para os comentários.
- Até 1.100 caracteres, parágrafos curtos, no máximo 2 emojis, 3 a 5 hashtags no final (ex.: #dados #sql #cienciadedados).
- Proibido clichê de LinkedIn ("animado em anunciar", "jornada incrível", "gratidão"). Sem markdown.
Responda só com o texto do post.`;

O que ela fez bem: ${r.fortes.join(' | ')}

Como um sênior conduziria: ${r.senior}
Frases que ela quer usar: ${r.frases.join(' | ')}
${r.star?`O que ela fez de fato: ${r.star.a} Resultado no caso: ${r.star.r}`:''}
${POST_RULES}`}

${weekSummary()}
Frases que ela aprendeu: ${(ST.casePhrases||[]).slice(0,3).map(p=>p.t).join(' | ')}
Escolha UM aprendizado concreto da semana como centro do post; números só os do resumo.
${POST_RULES}`}

function anyLayer(){return!$('#cases').hidden||!$('#sheet').hidden||!$('#lvlup').hidden}
function backLayer(){if(!$('#lvlup').hidden){$('#lvlup').hidden=true;return true}const ov=$('#caseOv');if(ov){closeOverlay();return true}
  if(!$('#cases').hidden){const a=ST.activeCase;if(caseView==='chat'&&a&&a.scene.mode!=='meeting'&&a.view==='thread'&&innerWidth<760){a.view='list';renderTeams();return true}
    if(caseView==='chat'||caseView==='debrief'){caseView='list';renderCases();return true}closeCases();return true}
  if(!$('#sheet').hidden){closeSheet();return true}return false}

/* Teclado do Android: mantém a caixa de mensagem visível acima dele */
if(window.visualViewport){const kb=()=>{const v=window.visualViewport,k=Math.max(0,Math.round(innerHeight-v.height-v.offsetTop));document.documentElement.style.setProperty('--kb',(k>80?k:0)+'px');document.body.classList.toggle('kb',k>80);if(k>80){const t=document.activeElement;if(t&&t.tagName==='TEXTAREA')setTimeout(()=>{const l=$('#cvLog');if(l)l.scrollTop=l.scrollHeight},60)}};visualViewport.addEventListener('resize',kb);visualViewport.addEventListener('scroll',kb)}
function copyText(t,btn){const done=()=>{if(btn){const o=btn.textContent;btn.textContent='Copiado';setTimeout(()=>btn.textContent=o,1600)}};try{navigator.clipboard.writeText(t).then(done,()=>{})}catch(e){}}
function showXfer(msg,text,copy){const x=$('#xfer');x.innerHTML=`<p class="sync" style="margin:8px 0">${esc(msg)}</p><textarea id="xfTxt" rows="7" readonly>${esc(text)}</textarea>${copy?'<div class="btnrow"><button class="btn primary" id="xfCopy" type="button">Copiar</button></div>':''}`;const ta=$('#xfTxt');ta.addEventListener('focus',()=>ta.select());const c=$('#xfCopy');if(c)c.addEventListener('click',()=>{copyText(text,c);ta.select()})}
/* Mapa neural: você no centro, cada categoria é um neurônio; a sinapse engrossa e acende com o domínio real (cards acertados 2× seguidas) */
function ringSVG(n,col){const x=n.x.toFixed(1),y=n.y.toFixed(1);if(n.sk==null)return'<circle cx="'+x+'" cy="'+y+'" r="26" fill="none" stroke="var(--line)" stroke-width="2" stroke-dasharray="2 4"/>';
  const C2=2*Math.PI*26,fr=clamp(n.sk/5,0,1);let o='<circle cx="'+x+'" cy="'+y+'" r="26" fill="none" stroke="var(--line)" stroke-width="3"/><circle cx="'+x+'" cy="'+y+'" r="26" fill="none" stroke="'+col+'" stroke-width="3" stroke-linecap="round" stroke-dasharray="'+(C2*fr).toFixed(1)+' '+C2.toFixed(1)+'" transform="rotate(-90 '+x+' '+y+')"/>';
  if(n.hot)o+='<circle cx="'+x+'" cy="'+y+'" r="30" fill="none" stroke="'+col+'" stroke-width="1.5"><animate attributeName="r" values="28;38;28" dur="1.8s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values=".7;0;.7" dur="1.8s" repeatCount="indefinite"/></circle>';return o}
function neuralMap(tracks){const W=340,H=260,cx=W/2,cy=H/2+2,R=86,cols={dados:'var(--cat-dados)',estat:'var(--cat-estat)',modelo:'var(--cat-modelo)',negocio:'var(--cat-negocio)'},ang=[-135,-45,45,135];
  const nodes=tracks.map((t,i)=>{const a=ang[i]*Math.PI/180,p=t.n?t.m/t.n:0,sk=liveSkill(t.k),lv=(ST.live||{})[t.k],hot=lv&&Date.now()-lv.last<36e5*24;return{...t,p,sk,hot,x:cx+Math.cos(a)*R*1.25,y:cy+Math.sin(a)*R*.82,a}});
  const dend=n=>{let out='';const k=12,lit=Math.round(n.p*k);for(let j=0;j<k;j++){const b=n.a+(j-(k-1)/2)*0.16,r1=24,r2=24+10+(j%3)*5;const x1=n.x+Math.cos(b)*r1,y1=n.y+Math.sin(b)*r1,x2=n.x+Math.cos(b)*r2,y2=n.y+Math.sin(b)*r2;out+=`<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="${j<lit?cols[n.k]:'var(--line)'}" stroke-width="2" stroke-linecap="round"/><circle cx="${x2.toFixed(1)}" cy="${y2.toFixed(1)}" r="2" fill="${j<lit?cols[n.k]:'var(--line)'}"/>`}return out};
  return`<div><h4>Seu mapa neural</h4><div class="nmap"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Mapa de domínio por categoria: ${nodes.map(n=>`${CATS[n.k]} ${Math.round(n.p*100)}%`).join(', ')}">
   ${nodes.map(n=>`<line x1="${cx}" y1="${cy}" x2="${n.x.toFixed(1)}" y2="${n.y.toFixed(1)}" stroke="${cols[n.k]}" stroke-opacity="${(0.18+n.p*0.82).toFixed(2)}" stroke-width="${(1.5+n.p*7).toFixed(1)}" stroke-linecap="round"/>`).join('')}
   ${nodes.map(n=>dend(n)).join('')}
   ${nodes.map(n=>ringSVG(n,cols[n.k])).join('')}
   ${nodes.map(n=>`<circle cx="${n.x.toFixed(1)}" cy="${n.y.toFixed(1)}" r="20" fill="var(--bg2)" stroke="${cols[n.k]}" stroke-width="2.5"/><text x="${n.x.toFixed(1)}" y="${(n.y+5).toFixed(1)}" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12.5" font-weight="700" fill="var(--fg)">${Math.round(n.p*100)}%</text><text x="${n.x.toFixed(1)}" y="${(n.y+(n.y<cy?-46:56)).toFixed(1)}" text-anchor="middle" font-family="Figtree, sans-serif" font-size="11" font-weight="600" fill="${cols[n.k]}">${CATS[n.k].split(' ')[0]}${n.sk!=null?` · casos ${num(n.sk,1)}/5`:''}</text>`).join('')}
   <circle cx="${cx}" cy="${cy}" r="17" fill="var(--spark)"/><circle cx="${cx}" cy="${cy}" r="25" fill="none" stroke="var(--spark)" stroke-opacity=".35" stroke-width="2"><animate attributeName="r" values="19;29;19" dur="2.4s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values=".5;0;.5" dur="2.4s" repeatCount="indefinite"/></circle><text x="${cx}" y="${cy+4}" text-anchor="middle" font-family="Bricolage Grotesque, sans-serif" font-size="12" font-weight="800" fill="var(--bg)">você</text></svg></div>
   <p class="empty" style="margin-top:4px">Dendritos e sinapse: domínio nos cards. Anel externo: seu raciocínio nos casos, lido jogada a jogada, inclusive com caso em andamento; ele pulsa quando houve atividade nas últimas 24 h.</p>${(ST.liveLog||[]).length?`<h4 style="margin-top:12px">Raciocínio nos casos</h4><div class="list">${ST.liveLog.slice(0,6).map(x=>`<div class="li t-${x.k}"><span class="chip">${x.v>=2?'↑':x.v===1?'→':'↓'} ${esc(CATS[x.k])}</span><span>${esc(x.o||'—')}</span><small>${esc(x.case)}${ST.activeCase&&!ST.activeCase.done&&ST.activeCase.def.title===x.case?' · em andamento':''}</small></div>`).join('')}</div>`:''}</div>`}
function weekSpark(){const ds=[];for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const k=dayStr(d),x=(ST.days||{})[k];ds.push({k,xp:x?Math.max(0,x.xp):0,d})}const mx=Math.max(1,...ds.map(d=>d.xp)),tot=ds.reduce((a,d)=>a+d.xp,0),wd=['D','S','T','Q','Q','S','S'];
  return`<div><h4>Últimos 7 dias · ${tot.toLocaleString('pt-BR')} XP</h4><div class="spark7" role="img" aria-label="XP por dia nos últimos 7 dias">${ds.map((d,i)=>`<i class="${i===6?'today':''}" style="height:${Math.max(5,d.xp/mx*100)}%" title="${d.k}: ${d.xp} XP"></i>`).join('')}</div><div class="spark7-lab">${ds.map((d,i)=>`<span>${i===6?'hoje':wd[d.d.getDay()]}</span>`).join('')}</div></div>`}
function calibHTML(){const c=ST.calib||{},ks=[50,70,90].filter(k=>c[k]&&c[k][1]);if(!ks.length)return'';return`<div><h4>Calibração das suas hipóteses</h4><div class="mastery">${ks.map(k=>{const[o,n]=c[k],p=o/n;return`<div class="mrow"><span>Quando diz ${k}% (${n})</span><div class="mbar calib" style="overflow:visible"><i style="width:${Math.round(p*100)}%;background:${Math.abs(p*100-k)<=12?'var(--ok)':'var(--gold)'}"></i><span class="exp" style="left:${k}%" title="ideal"></span></div><output>${Math.round(p*100)}%</output></div>`}).join('')}</div><p class="empty" style="margin-top:6px">Bem calibrado é acertar perto do que você diz. Acerta menos do que diz: excesso de confiança. Acerta mais: confie mais no seu raciocínio.</p></div>`}
function weekSummary(){let xp=0,ok=0,bad=0,cs=0;for(let i=0;i<7;i++){const d=new Date();d.setDate(d.getDate()-i);const x=(ST.days||{})[dayStr(d)];if(x){xp+=x.xp;ok+=x.ok;bad+=x.bad;cs+=x.cases}}
  const since=(()=>{const d=new Date();d.setDate(d.getDate()-6);return dayStr(d)})(),recent=(ST.cases||[]).filter(c=>c.date>=since),sk=CAT_KEYS.map(k=>[k,skillAvg(k)]).filter(x=>x[1]!=null),story=(ST.stories||[]).find(h=>h.date>=since);
  return['Minha semana estudando dados (Sinapse):',`- ${xp.toLocaleString('pt-BR')} XP, ${ok+bad} perguntas respondidas${ok+bad?` com ${Math.round(ok/(ok+bad)*100)}% de acerto`:''}, ${cs} caso${cs===1?'':'s'} simulado${cs===1?'':'s'}.`,
   ...recent.map(c=>`- Caso "${c.title}": nota ${c.nota}/10`),sk.length?'- Competências nos casos (0 a 5): '+sk.map(([k,v])=>`${CATS[k]} ${num(v,1)}`).join(', ')+'.':'',
   ST.career?`- Carreira simulada: ${CAREER_LEVELS[ST.career.level]} na ${COMPANIES[ST.career.co].name}.`:'',story?`\nHistória da semana, "${story.title}": ${story.a} Resultado: ${story.r}`:''].filter(Boolean).join('\n')}
function exportCode(){const st=JSON.parse(JSON.stringify(ST));if(st.activeCase)delete st.activeCase.api;return 'SINAPSE1.'+btoa(unescape(encodeURIComponent(JSON.stringify({st,gen:GEN.slice(-300)}))))}
function importCode(code,msg){try{const raw=String(code||'').trim().replace(/^SINAPSE1\./,'');const o=JSON.parse(decodeURIComponent(escape(atob(raw))));if(!o||!o.st||typeof o.st.xp!=='number')throw 0;
  const keepSound=ST.sound;ST=Object.assign(DEF(),o.st);ST.sound=keepSound;if(ST.activeCase&&!ST.activeCase.api)ST.activeCase=null;(o.gen||[]).forEach(c=>{if(c&&c.id&&!GEN.some(x=>x.id===c.id)){GEN.push(c);registerCard(c)}});persistGen();lastLevel=levelInfo(ST.xp).L;save();dirty=true;flush();hud(false);msg.textContent='Progresso trazido. Nível '+lastLevel+'.';setTimeout(()=>{closeSheet();resetFeed()},900)}
  catch(e){msg.textContent='Código inválido. Copie o código inteiro, começando por SINAPSE1.'}}

addEventListener('keydown',e=>{if(!$('#cases').hidden){if(e.key==='Escape'&&e.target.tagName!=='TEXTAREA')closeCases();return}if(!$('#sheet').hidden){if(e.key==='Escape')closeSheet();return}if(e.target.tagName==='INPUT')return;const f=$('#feed');
  if(e.key==='ArrowDown'||e.key==='j'||e.key==='J'||e.key===' '){e.preventDefault();f.scrollBy({top:f.clientHeight})}
  else if(!e.ctrlKey&&!e.metaKey&&!e.altKey&&(e.key==='c'||e.key==='C')){openCases()}
  else if(!e.ctrlKey&&!e.metaKey&&!e.altKey&&(e.key==='p'||e.key==='P')){openSheet()}
  else if(!e.ctrlKey&&!e.metaKey&&!e.altKey&&(e.key==='f'||e.key==='F')){$('#navFeed').click()}
  else if(e.key==='ArrowUp'||e.key==='k'||e.key==='K'){e.preventDefault();f.scrollBy({top:-f.clientHeight})}
  else if(/^[1-4]$/.test(e.key)&&cur&&cur.c.kind==='quiz'&&!cur.done){const b=cur.el.querySelectorAll('.opt')[+e.key-1];if(b)b.click()}
  else if(/^[1-4]$/.test(e.key)&&cur&&cur.c.kind==='chain'&&cur.stepEl&&!cur.stepDone){const b=cur.stepEl.querySelectorAll('.opt')[+e.key-1];if(b)b.click()}});
